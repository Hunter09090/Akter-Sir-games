<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation Gallery</title>
    <link rel="stylesheet" href="animation.css">
</head>
<body>

    <h1 class="title">🎬 Animation Gallery</h1>

    <div class="gallery">

        <div class="card" onclick="playAnimation('heart')">
            <div class="preview heart-preview">💖</div>
            <h3>Heart Animation</h3>
        </div>

        <div class="card" onclick="playAnimation('star')">
            <div class="preview star-preview">⭐</div>
            <h3>Star Animation</h3>
        </div>

        <div class="card" onclick="playAnimation('butterfly')">
            <div class="preview butterfly-preview">🦋</div>
            <h3>Butterfly Animation</h3>
        </div>

        <div class="card" onclick="playAnimation('spiral')">
            <div class="preview spiral-preview">🌀</div>
            <h3>Spiral Animation</h3>
        </div>

    </div>

    <canvas id="mainCanvas"></canvas>

    <button id="closeBtn" onclick="closeAnimation()">✖ Close</button>

    <script src="animation.js"></script>

</body>
</html>
