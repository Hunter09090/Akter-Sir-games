<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Whack The Alien</title>

  <link rel="stylesheet" href="alien.css">
</head>

<body>

  <!-- HUD -->

  <div class="hud">

    <div class="hud-box">
      👽 Score:
      <span id="score">0</span>
    </div>

    <div class="hud-box">
      ⏱️ Time:
      <span id="time">30</span>s
    </div>

  </div>

  <!-- Game Area -->

  <div id="gameArea" class="game-area">

    <div class="hole" data-index="0"></div>
    <div class="hole" data-index="1"></div>
    <div class="hole" data-index="2"></div>

    <div class="hole" data-index="3"></div>
    <div class="hole" data-index="4"></div>
    <div class="hole" data-index="5"></div>

    <div class="hole" data-index="6"></div>
    <div class="hole" data-index="7"></div>
    <div class="hole" data-index="8"></div>

  </div>

  <!-- Start Screen -->

  <div id="startOverlay" class="start-overlay">

    <div class="start-card">

      <h1>👽 WHACK THE ALIEN</h1>

      <p>Tap the aliens as fast as possible before time runs out!</p>

      <button id="startBtn" class="start-btn">
        ▶ START GAME
      </button>

    </div>

  </div>

  <script src="alien.js"></script>

</body>
</html>
