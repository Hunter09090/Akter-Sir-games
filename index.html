<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070812"><title>GAME HUB OF SIR</title><style>*{box-sizing:border-box}body{margin:0;background:#070812;color:#fff;font-family:system-ui,Arial}.bar{position:sticky;top:0;z-index:10;background:#0b0e1bf5;border-bottom:1px solid #293153}.barin{max-width:1100px;margin:auto;padding:13px 18px;display:flex;align-items:center;justify-content:space-between}.logo{color:#5ee7ff;font-weight:900;text-decoration:none}.nav{display:flex;gap:7px;align-items:center}.nav a{color:#fff;text-decoration:none;padding:10px 13px;border-radius:10px}.nav a:hover{background:#19203b}.hamb{display:none;border:1px solid #39456d;background:#171c34;color:#fff;border-radius:10px;padding:9px 13px;font-size:20px}.hero{max-width:1050px;margin:auto;padding:55px 18px 30px;text-align:center}.hero h1{font-size:clamp(45px,9vw,82px);line-height:.9;margin:12px 0;background:linear-gradient(90deg,#fff,#5ee7ff,#ff5ebc);-webkit-background-clip:text;color:transparent}.hero p{color:#aab3d5;max-width:650px;margin:0 auto 20px}.btn{display:inline-block;text-decoration:none;color:#fff;background:#172744;border:1px solid #3d587c;padding:11px 16px;border-radius:11px;font-weight:800}.section{max-width:1100px;margin:auto;padding:25px 18px 70px}.head{display:flex;justify-content:space-between;align-items:end}.head h2{margin:0}.count{color:#8e99bb}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:18px}.card{min-height:235px;display:flex;flex-direction:column;padding:19px;border:1px solid #2c3558;border-radius:20px;background:linear-gradient(145deg,#11162a,#090b15)}.icon{font-size:42px}.tag{color:#ff5ebc;font-size:11px;font-weight:900;letter-spacing:1px;margin-top:8px}.card h3{margin:6px 0}.card p{color:#9da5c7;line-height:1.45;margin:0 0 14px}.play{margin-top:auto;text-align:center;text-decoration:none;color:#fff;background:#172744;border:1px solid #3d587c;padding:11px;border-radius:11px;font-weight:800}.about{max-width:1100px;margin:auto;padding:0 18px 70px;color:#9da5c7}@media(max-width:700px){.hamb{display:block}.nav{display:none;position:absolute;top:62px;left:12px;right:12px;padding:9px;flex-direction:column;background:#10152a;border:1px solid #30385f;border-radius:15px}.nav.open{display:flex}.nav a{width:100%;text-align:center}.hero{padding-top:42px}}</style></head><body><header class="bar"><div class="barin"><a class="logo" href="index.html">🎮 GAME HUB OF SIR</a><button class="hamb" id="hamb" aria-label="Open menu">☰</button><nav class="nav" id="nav"><a href="index.html">🏠 Home</a><a href="games.html">🎮 Games</a><a href="leaderboard.html">🏆 Leaderboard</a><a href="profile.html">👤 Profile</a></nav></div></header><main><section class="hero"><div>🎮 GAME COLLECTION</div><h1>GAME HUB<br>OF SIR</h1><p>এক জায়গায় আমার তৈরি সব browser games — খেলুন, পরীক্ষা করুন, আর নিজের সেরা স্কোর তৈরি করুন।</p><a class="btn" href="#games">🔥 গেমগুলো দেখুন</a></section><section class="section" id="games"><div class="head"><h2>🎮 My Games</h2><span class="count" id="count"></span></div><div class="grid" id="grid"></div></section></main><script>const G=[['reaction.html','⚡','Reaction Time Test','Skill','Test your reaction speed.'],['coin.html','🪙','Coin Toss','Casual','Flip a virtual coin.'],['alien.html','👽','Whack The Alien','Arcade','Whack aliens before time runs out.'],['dice.html','🎲','Dice Roller','Casual','Roll a random dice.'],['tic.html','❌','Tic Tac Toe','Brain','Classic XO strategy game.'],['wheel.html','🎡','Spin The Wheel','Casual','Spin and get a surprise.'],['truth.html','🤔','Truth Or Dare','Casual','Play a fun round with friends.'],['challenge.html','🎯','Random Challenge','Skill','Complete a fun challenge.'],['aim.html','🎯','Aim Trainer','Skill','Improve your aiming skill.'],['banana.html','🍌','Banana Slip Battle','Arcade','Dodge banana peels and stay on your feet.'],['jump.html','🦘','Jump Game','Arcade','Jump over obstacles and survive.'],['memory.html','🧠','Memory Match','Brain','Match emoji pairs and train your brain.'],['rps.html','✊','Rock Paper Scissors','Casual','Play against the computer.'],['mindreader.html','🔮','Mind Reader','Brain','Think of a number and test the magic.'],['balloon.html','🎈','Balloon Pop','Arcade','Pop balloons before the timer ends.'],['neon.html','🌌','Neon Catcher','Arcade','Catch glowing neon orbs.'],['rocket.html','🚀','Rocket Dodge','Space','Dodge asteroids in an endless space runner.'],['thunder.html','⚡','Thunder Tap','Skill','Test your lightning-fast reaction speed.'],['target.html','🎯','Target Storm','Skill','Hit targets, avoid bombs and build combos.'],['animation.html','🎬','Animation Gallery','Casual','Explore beautiful interactive particle animations.'],['cosmic.html','🌌','Cosmic Odyssey','Space','Travel into deep space and escape the black hole.'],['penguin.html','🐧','Penguin Slide','Arcade','Slide across the ice, collect fish and avoid holes.'],['escape-the-website/index.html','🧪','Escape The Website','Brain','Escape a crazy browser room using clues, logic and hidden tricks.']];const grid=document.getElementById('grid');grid.innerHTML=G.map(g=>`<article class="card"><div class="icon">${g[1]}</div><div class="tag">${g[3]}</div><h3>${g[2]}</h3><p>${g[4]}</p><a class="play" href="${g[0]}">▶ Play Now</a></article>`).join('');document.getElementById('count').textContent=G.length+' games';const h=document.getElementById('hamb'),n=document.getElementById('nav');h.onclick=()=>{const o=n.classList.toggle('open');h.textContent=o?'✕':'☰'};n.querySelectorAll('a').forEach(a=>a.onclick=()=>{n.classList.remove('open');h.textContent='☰'});</script></body></html>
