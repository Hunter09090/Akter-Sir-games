<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Game Hub</title>

    <meta
        name="description"
        content="Play Fun Games Online">

    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="style.css">

    <!-- Header CSS -->
    <link
        rel="stylesheet"
        href="header.css">

    <!-- Theme CSS -->
    <link
        rel="stylesheet"
        href="theme.css">

    <!-- Game CSS -->
    <link
        rel="stylesheet"
        href="game.css">

    <!-- Responsive CSS -->
    <link
        rel="stylesheet"
        href="responsive.css">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <!-- ==========================
         Header
    =========================== -->

    <div id="header"></div>



    <!-- ==========================
         Hero
    =========================== -->

    <section class="hero">

        <h1>

        </h1>

        <p>

            Play Fun Games Anytime

        </p>

    </section>



    <!-- ==========================
         Search
    =========================== -->

    <section class="search-section">

        <input
            type="text"
            id="searchInput"
            placeholder="Search Game...">

    </section>



    <!-- ==========================
         Games
    =========================== -->

    <main class="games-container"
          id="gamesContainer">

        <!--
            Game Card
            Automatically Added By app.js
        -->

    </main>



    <!-- ==========================
         Footer
    =========================== -->
<div id="footer"></div>

<script src="utils.js"></script>

<script src="layout.js"></script>

<script src="header.js"></script>

<script src="footer.js"></script>

</html>
