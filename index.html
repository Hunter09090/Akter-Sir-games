<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Game Hub</title>

    <meta name="description"
          content="Play Fun Games Online">

    <link rel="stylesheet"
          href="style.css">

    <link rel="stylesheet"
          href="responsive.css">

</head>

<body>

    <!-- ==========================
         Header
    =========================== -->

    <header class="header">

        <div class="logo">

            🎮 Game Hub

        </div>

    </header>



    <!-- ==========================
         Hero
    =========================== -->

    <section class="hero">

        <h1>

            Welcome To Game Hub

        </h1>

        <p>

            Play Fun Games Anytime

        </p>

    </section>



    <!-- ==========================
         Search
    =========================== -->

    <section class="search-section">

        <input
            type="text"
            id="searchInput"
            placeholder="Search Game...">

    </section>



    <!-- ==========================
         Games
    =========================== -->

    <main class="games-container"
          id="gamesContainer">

        <!--
            Game Card
            Automatically Added By app.js
        -->

    </main>



    <!-- ==========================
         Footer
    =========================== -->

    <footer class="footer">

        <p>

            © 2026 Game Hub

        </p>

    </footer>



    <script src="utils.js"></script>

    <script src="app.js"></script>

</body>

</html>
