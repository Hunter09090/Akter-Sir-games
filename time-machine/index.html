<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b16"><title>TIME MACHINE</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#070a12;color:#eef3ff;font-family:system-ui,Arial,sans-serif;overflow-x:hidden}.wrap{width:min(1050px,92%);margin:auto;padding:18px 0 60px}.top{display:flex;justify-content:space-between;align-items:center}.back{color:#bdeaff;text-decoration:none;border:1px solid #29455c;background:#0e1824;padding:9px 13px;border-radius:11px}.brand{font-weight:900;color:#7ee7ff;letter-spacing:1px}.hero{text-align:center;padding:55px 0 28px}.eyebrow{font-size:11px;letter-spacing:4px;color:#8b9bb6;font-weight:900}.hero h1{font-size:clamp(48px,10vw,92px);line-height:.88;margin:12px 0;background:linear-gradient(90deg,#fff,#73e8ff,#b38cff);-webkit-background-clip:text;color:transparent}.hero p{color:#9da9bd;max-width:670px;margin:auto;line-height:1.6}.machine{margin:18px auto 0;max-width:850px;border:1px solid #2c4158;background:linear-gradient(145deg,#101827,#090d16);border-radius:28px;padding:25px;box-shadow:0 30px 100px #0009}.display{position:relative;min-height:300px;border:1px solid #32485e;border-radius:21px;background:#05070c;overflow:hidden;display:grid;place-items:center}.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 5px,#7de7ff08 6px);pointer-events:none}.portal{width:min(430px,75vw);height:min(250px,48vw);border-radius:50%;display:grid;place-items:center;text-align:center;border:2px solid #76e9ff88;background:radial-gradient(ellipse,#172c3b 0,#0b1520 45%,#05070c 72%);box-shadow:0 0 25px #54dfff44,0 0 100px #5b62ff22;transition:.5s}.portal.travel{animation:warp .9s}@keyframes warp{0%{transform:scale(1);filter:blur(0)}50%{transform:scale(1.18);filter:blur(3px)}100%{transform:scale(1);filter:blur(0)}}.year{font-size:clamp(42px,9vw,75px);font-weight:1000;letter-spacing:-3px}.era{color:#8eddf1;font-size:12px;letter-spacing:3px;font-weight:900}.desc{color:#aab4c6;margin-top:5px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.control{background:#0c1320;border:1px solid #293c51;border-radius:15px;padding:14px}.control label{display:block;color:#8796aa;font-size:11px;font-weight:900;margin-bottom:8px;letter-spacing:1px}.yearInput{width:100%;accent-color:#72e5ff}.yearBox{display:flex;gap:8px}.yearBox input{width:100%;background:#070b12;color:#fff;border:1px solid #34495f;border-radius:10px;padding:10px;font-weight:800}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{border:1px solid #39546b;background:#132031;color:#fff;padding:10px 13px;border-radius:10px;font-weight:900;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#16758b,#51419a);border-color:#68d8ed}.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}.eraBtn{border:1px solid #263b50;background:#0d1520;color:#cbd6e5;border-radius:11px;padding:11px 6px;cursor:pointer}.eraBtn:hover{border-color:#65dff5}.eraBtn b{display:block;color:#fff}.facts{margin-top:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.fact{padding:13px;border-radius:13px;background:#0c121c;border:1px solid #253648}.fact b{display:block;color:#75e5ff;margin-bottom:4px}.fact span{font-size:12px;color:#8f9bac}.log{margin-top:18px;display:grid;gap:7px}.msg{padding:9px 11px;border-radius:10px;background:#0b111a;border:1px solid #203143;color:#8f9bac;font-size:12px}.msg strong{color:#a8edff}.footer{text-align:center;color:#566477;font-size:11px;margin-top:22px}@media(max-width:650px){.machine{padding:14px}.controls,.facts{grid-template-columns:1fr}.timeline{grid-template-columns:repeat(2,1fr)}.display{min-height:260px}}
</style></head><body><div class="wrap"><header class="top"><a class="back" href="../index.html">← Game Hub</a><div class="brand">⏳ TEMPORAL LAB</div></header><section class="hero"><div class="eyebrow">PAST • PRESENT • FUTURE</div><h1>TIME MACHINE</h1><p>একটি বছর বেছে নাও। Machine সময়ের দরজা খুলবে—তারপর দেখাবে সেই সময়ের পৃথিবী কেমন হতে পারে।</p></section><section class="machine"><div class="display"><div class="scan"></div><div class="portal" id="portal"><div><div class="era" id="era">PRESENT</div><div class="year" id="year">2026</div><div class="desc" id="desc">The world you know.</div></div></div></div><div class="controls"><div class="control"><label>CHOOSE A YEAR</label><input class="yearInput" id="range" type="range" min="1800" max="2200" value="2026"><div class="yearBox"><input id="number" type="number" min="1800" max="2200" value="2026"><button class="btn primary" id="go">⚡ Travel</button></div></div><div class="control"><label>QUICK TIME JUMPS</label><div class="btns"><button class="btn" data-year="1900">1900</button><button class="btn" data-year="1950">1950</button><button class="btn" data-year="2026">2026</button><button class="btn" data-year="2050">2050</button><button class="btn" data-year="2100">2100</button></div></div></div><div class="timeline"><button class="eraBtn" data-year="1800"><b>1800</b>Past</button><button class="eraBtn" data-year="1925"><b>1925</b>Early Modern</button><button class="eraBtn" data-year="2026"><b>2026</b>Now</button><button class="eraBtn" data-year="2200"><b>2200</b>Future</button></div><div class="facts" id="facts"></div><div class="log" id="log"></div></section><div class="footer">Every journey changes the view. The future is a simulation, not a prediction.</div></div><script>
const $=id=>document.getElementById(id),KEY='timeMachineVisits';let visits=JSON.parse(localStorage.getItem(KEY)||'0');
const eras=y=>y<1900?['THE OLD WORLD','Before electricity reshaped everyday life.',['Steam power','Horse transport','Handwritten records']]:y<1950?['EARLY MODERN','Cities, radio and machines are transforming life.',['Radio & cinema','Early aviation','Industrial cities']]:y<2026?['PRESENT','The connected digital world.',['Smartphones','Global internet','Artificial intelligence']]:y<2050?['NEAR FUTURE','A speculative world of cleaner technology and automation.',['Autonomous transport','Advanced robotics','Clean energy']]:y<2150?['FAR FUTURE','A fictional civilization shaped by space-age technology.',['Moon settlements','Machine partners','Orbital cities']]:['DISTANT FUTURE','Pure imagination: a civilization beyond our century.',['Deep-space travel','Synthetic ecosystems','Unknown technology']];
function travel(y){y=Math.max(1800,Math.min(2200,Number(y)||2026));$('range').value=y;$('number').value=y;const e=eras(y);$('portal').classList.remove('travel');void $('portal').offsetWidth;$('portal').classList.add('travel');$('year').textContent=y;$('era').textContent=e[0];$('desc').textContent=e[1];$('facts').innerHTML=e[2].map((x,i)=>'<div class="fact"><b>'+['01','02','03'][i]+'</b><span>'+x+'</span></div>').join('');visits++;localStorage.setItem(KEY,visits);log('⏱️ <strong>Time jump #'+visits+':</strong> Arrived in '+y+'.');}
function log(t){const d=document.createElement('div');d.className='msg';d.innerHTML=t;$('log').prepend(d);while($('log').children.length>4)$('log').lastChild.remove()}
$('range').oninput=e=>{$('number').value=e.target.value};$('number').oninput=e=>{$('range').value=Math.max(1800,Math.min(2200,e.target.value))};$('go').onclick=()=>travel($('number').value);document.querySelectorAll('[data-year]').forEach(b=>b.onclick=()=>travel(b.dataset.year));travel(2026);log('🕰️ <strong>Temporal Lab online.</strong> Choose a year and travel.');
</script></body></html>
