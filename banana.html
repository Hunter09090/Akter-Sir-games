<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Banana Slip Battle</title>

  <link rel="stylesheet" href="banana.css">
</head>

<body>

  <!-- HUD -->

  <div class="hud">

    <div class="hud-box">
      🏆 Score:
      <span id="score">0</span>
    </div>

    <div class="hud-box">
      ⭐ Best:
      <span id="bestScore">0</span>
    </div>

  </div>

  <!-- Game Area -->

  <div id="gameArea" class="game-area">

    <!-- Runner -->
    <div id="runner" class="runner">🏃</div>

  </div>

  <!-- Mobile Controls -->

  <div class="mobile-controls">

    <button id="leftBtn" class="control-btn">⬅️</button>

    <button id="rightBtn" class="control-btn">➡️</button>

  </div>

  <!-- Start Screen -->

  <div id="startOverlay" class="start-overlay">

    <div class="start-card">

      <h1>🍌 BANANA SLIP BATTLE</h1>

      <p>Run as far as possible without slipping on banana peels!</p>

      <button id="startBtn" class="start-btn">
        ▶ START RUN
      </button>

    </div>

  </div>

  <script src="banana.js"></script>

</body>
</html>
