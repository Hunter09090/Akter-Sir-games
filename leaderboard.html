<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leaderboard — GAME HUB OF SIR</title><style>*{box-sizing:border-box}body{margin:0;background:#070812;color:#fff;font-family:system-ui,Arial}.wrap{max-width:980px;width:92%;margin:auto;padding:20px 0 70px}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#fff;text-decoration:none;border:1px solid #30385f;padding:9px 13px;border-radius:11px}.nav{display:flex;gap:5px;flex-wrap:wrap}.nav a{color:#fff;text-decoration:none;padding:8px 10px;border-radius:9px}.nav a:hover{background:#19203b}.hero{text-align:center;padding:45px 0 25px}.hero h1{font-size:clamp(40px,8vw,70px);margin:8px 0;background:linear-gradient(90deg,#fff,#ffe27a,#ff72c8);-webkit-background-clip:text;color:transparent}.muted{color:#9da5c7}.board{display:grid;gap:10px}.row{display:grid;grid-template-columns:55px 60px 1fr 100px;align-items:center;gap:10px;padding:15px 17px;border:1px solid #2b3457;background:#101426;border-radius:16px}.rank{font-size:25px;font-weight:1000}.icon{font-size:31px}.plays{text-align:right;color:#8ff2ff;font-weight:900}.empty{text-align:center;padding:35px;border:1px dashed #30385d;border-radius:18px;color:#8e99bb}@media(max-width:600px){.row{grid-template-columns:45px 45px 1fr 75px;padding:12px}.plays{font-size:12px}.nav{display:none}}
</style></head><body><div class="wrap"><header class="top"><a href="index.html">🎮 GAME HUB OF SIR</a><nav class="nav"><a href="index.html">Home</a><a href="games.html">Games</a><a href="achievements.html">Achievements</a><a href="leaderboard.html">Leaderboard</a><a href="profile.html">Profile</a></nav></header><section class="hero"><div style="font-size:60px">🏆</div><h1>LOCAL LEADERBOARD</h1><p class="muted">Your most-played games on this device. Nothing is uploaded or invented.</p></section><main id="board" class="board"></main><div id="empty" class="empty" hidden>🎮 No game activity yet.<br><br>Play a game from the Hub and come back.</div></div><script>const ICON={"Reaction Time Test":"⚡","Coin Toss":"🪙","Whack The Alien":"👽","Dice Roller":"🎲","Tic Tac Toe":"❌","Spin The Wheel":"🎡","Truth Or Dare":"🤔","Random Challenge":"🎯","Aim Trainer":"🎯","Banana Slip Battle":"🍌","Jump Game":"🦘","Memory Match":"🧠","Rock Paper Scissors":"✊","Mind Reader":"🔮","Balloon Pop":"🎈","Neon Catcher":"🌌","Rocket Dodge":"🚀","Thunder Tap":"⚡","Target Storm":"🎯","Animation Gallery":"🎬","Cosmic Odyssey":"🌌","Penguin Slide":"🐧","Escape The Website":"🗝️","Website That Changes Every Time":"🪄","Crazy Science Lab":"🧪","Dragon Egg":"🐉"};const p=JSON.parse(localStorage.getItem('gh_plays_v2')||'{}');const rows=Object.entries(p).map(([name,count])=>({name,count:Number(count),icon:ICON[name]||'🎮'})).sort((a,b)=>b.count-a.count);document.getElementById('board').innerHTML=rows.map((r,i)=>'<div class="row"><div class="rank">#'+(i+1)+'</div><div class="icon">'+r.icon+'</div><div><b>'+r.name+'</b><div class="muted">Played on this device</div></div><div class="plays">'+r.count+' plays</div></div>').join('');document.getElementById('empty').hidden=rows.length>0;</script></body></html>
