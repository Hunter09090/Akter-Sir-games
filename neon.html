<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Neon Catcher</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="neon.css">
</head>

<body>

  <!-- Header -->

  <header class="simple-header">
    <div class="simple-header-container">

      <a href="index.html" class="simple-logo">
        <img
          src="https://cdn-icons-png.flaticon.com/512/686/686589.png"
          alt="Logo">

        <span>GAME HUB OF SIR</span>
      </a>

      <nav class="simple-nav">
        <a href="index.html">Home</a>
        <a href="games.html">Games</a>
        <a href="leaderboard.html">Leaderboard</a>
        <a href="profile.html">Profile</a>
      </nav>

      <button class="theme-btn">🌙</button>

    </div>
  </header>

  <!-- Game Area -->

  <main class="game-page">

    <div class="game-box neon-box">

      <h1>🌌 Neon Catcher</h1>

      <p>
        Catch the glowing neon orbs and avoid missing them!
      </p>

      <!-- Score Board -->

      <div class="neon-top-bar">

        <div class="neon-score">
          🏆 Score:
          <strong id="score">0</strong>
        </div>

        <div class="neon-life">
          ❤️ Life:
          <strong id="life">3</strong>
        </div>

      </div>

      <!-- Game Area -->

      <div id="gameArea" class="neon-game-area">

        <!-- Basket -->

        <div id="basket" class="basket"></div>

      </div>

      <!-- Mobile Controls -->

      <div class="mobile-controls">

        <button id="leftBtn" class="control-btn">
          ⬅️
        </button>

        <button id="rightBtn" class="control-btn">
          ➡️
        </button>

      </div>

      <!-- Start Button -->

      <button id="startBtn" class="play-btn">
        ▶ Start Game
      </button>

    </div>

  </main>

  <!-- Footer -->

  <footer class="simple-footer">

    <div class="simple-footer-container">

      <h2>GAME HUB OF SIR</h2>

      <p>
        Learn, Play & Improve your skills with fun games.
      </p>

      <div class="footer-social">

        <a href="https://www.facebook.com/ahr110" target="_blank">
          Facebook
        </a>

        <a href="https://wa.me/8801884197276" target="_blank">
          WhatsApp
        </a>

        <a href="mailto:aakterhossen80@gmail.com">
          Email
        </a>

      </div>

      <p class="footer-copy">
        © 2026 GAME HUB OF SIR
      </p>

    </div>

  </footer>

  <script src="neon.js"></script>

</body>
</html>
