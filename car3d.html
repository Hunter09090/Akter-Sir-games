<html lang="en">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="car3d.css">
</head>

<body>

  <!-- ===== Header ===== -->

  <header class="simple-header">
    <div class="simple-header-container">

      <a href="index.html" class="simple-logo">
        <img
          src="https://cdn-icons-png.flaticon.com/512/686/686589.png"
          alt="Logo">

        <span>GAME HUB OF SIR</span>

      <nav class="simple-nav">

        <a href="games.html">Games</a>

        <a href="profile.html">Profile</a>
      </nav>

    </div>
  </header>

  <!-- ===== Game Area ===== -->

  <main class="game-page">

    <div class="game-box car3d-box">

      <h1>🏎️ 3D Highway Runner</h1>

      <p>
        Use ⬅️ Left and ➡️ Right arrow keys to move the car.
      </p>

      <!-- 3D Game Canvas -->

      <div id="gameContainer" class="game-container-3d"></div>

      <!-- Score -->

      <div class="car3d-score">
        <span>Score:</span>
        <strong id="score">0</strong>
      </div>
<div class="car3d-score best-score">
    <span>Best:</span>
    <strong id="bestScore">0</strong>
</div>
      <!-- Mobile Buttons -->

      <div class="mobile-controls">

        <button id="leftBtn" class="control-btn">
          ⬅️
        </button>

        <button id="rightBtn" class="control-btn">
          ➡️
        </button>

      </div>

    </div>

  </main>
