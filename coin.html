<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Coin Toss | Game Hub</title>

    <meta
        name="description"
        content="Play Coin Toss Online">

    <link
        rel="stylesheet"
        href="style.css">

    <link
        rel="stylesheet"
        href="responsive.css">

    <link
        rel="stylesheet"
        href="game.css">

</head>

<body>

    <!-- ==========================
         Header
    =========================== -->

    <div id="header"></div>



    <!-- ==========================
         Game Page
    =========================== -->

    <main class="game-page">

        <h1 class="game-title">

            🪙 Coin Toss

        </h1>

        <p class="game-description">

            Choose Head or Tail, flip the coin and test your luck!

        </p>



        <!-- ======================
             Game Box
        ======================= -->

        <section class="game-box">



            <!-- Coin -->

            <div
                id="coin"
                class="coin-view">

                🪙

            </div>



            <!-- Selected -->

            <div
                id="selectedChoice"
                class="badge">

                No Choice

            </div>



            <!-- Buttons -->

            <div class="button-group">

                <button
                    id="headBtn"
                    class="game-btn">

                    Head

                </button>

                <button
                    id="tailBtn"
                    class="game-btn">

                    Tail

                </button>

            </div>



            <!-- Toss -->

            <div class="button-group">

                <button
                    id="tossBtn"
                    class="game-btn">

                    Toss Coin

                </button>

            </div>



            <!-- Result -->

            <div
                id="result"
                class="game-result">

                Select Head or Tail

            </div>

        </section>
            <!-- ======================
                 Statistics
            ======================= -->

            <section class="game-stats">

                <div class="stat-card">

                    <div class="stat-title">

                        Head

                    </div>

                    <div
                        id="headCount"
                        class="stat-value">

                        0

                    </div>

                </div>



                <div class="stat-card">

                    <div class="stat-title">

                        Tail

                    </div>

                    <div
                        id="tailCount"
                        class="stat-value">

                        0

                    </div>

                </div>



                <div class="stat-card">

                    <div class="stat-title">

                        Total Toss

                    </div>

                    <div
                        id="totalCount"
                        class="stat-value">

                        0

                    </div>

                </div>

            </section>



            <!-- ======================
                 Action Buttons
            ======================= -->

            <div class="button-group">

                <button
                    id="playAgainBtn"
                    class="game-btn">

                    Play Again

                </button>

                <button
                    id="resetBtn"
                    class="game-btn">

                    Reset Statistics

                </button>

            </div>

        </section>

    </main>



    <!-- ==========================
         Footer
    =========================== -->

    <div id="footer"></div>



    <!-- ==========================
         Scripts
    =========================== -->

    <script src="utils.js"></script>

    <script src="layout.js"></script>

    <script src="coin.js"></script>

</body>

</html>
