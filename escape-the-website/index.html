<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070812">
<title>ESCAPE THE WEBSITE — AKTER CRAZY LAB</title>
<style>
:root{--bg:#070812;--card:#11152a;--card2:#0b0e1c;--text:#f7f8ff;--muted:#9da5c7;--cyan:#5ee7ff;--pink:#ff5ebc;--gold:#ffd166;--red:#ff5d73;--green:#67f5a5;--line:#30385f}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#292d63,#090b18 48%,#04050a);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}.wrap{width:min(980px,92vw);margin:auto}.top{height:70px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;color:var(--cyan);letter-spacing:.08em;font-size:.82rem}.hud{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.pill{padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:#0d1020;color:var(--muted);font-size:.75rem}.pill b{color:white}.screen{min-height:calc(100vh - 70px);display:grid;place-items:center;padding:18px 0 50px}.card{width:min(820px,100%);padding:clamp(22px,5vw,50px);border:1px solid #343d67;border-radius:28px;background:linear-gradient(145deg,#12162bf5,#080a13f5);box-shadow:0 25px 80px #0008}.center{text-align:center}.eyebrow{color:var(--pink);font-size:.72rem;font-weight:900;letter-spacing:.17em}.title{font-size:clamp(3rem,10vw,6rem);line-height:.88;margin:17px 0;background:linear-gradient(90deg,#fff,var(--cyan),#fff,var(--pink));-webkit-background-clip:text;color:transparent;background-size:300%;animation:shine 6s linear infinite}@keyframes shine{to{background-position:300%}}h2{font-size:clamp(1.6rem,5vw,2.6rem);margin:8px 0}p{color:var(--muted);line-height:1.65}.subtitle{max-width:650px;margin:0 auto 25px}.btn{border:1px solid #3c4772;background:#171c34;color:#fff;border-radius:14px;padding:12px 18px;font-weight:800;transition:.18s}.btn:hover{transform:translateY(-2px);border-color:var(--cyan)}.primary{background:linear-gradient(135deg,#226d86,#5a42a9);border-color:#5ee7ff66}.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.input{width:100%;background:#080a13;border:1px solid #39456d;color:#fff;border-radius:12px;padding:13px;outline:0}.input:focus{border-color:var(--cyan)}.name{max-width:430px;margin:0 auto 12px}.diffs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:680px;margin:15px auto 22px}.diff{padding:15px;text-align:left;border:1px solid var(--line);border-radius:15px;background:#0d1121;color:#fff}.diff small{display:block;color:var(--muted);margin-top:4px}.diff.active{border-color:var(--cyan);box-shadow:0 0 0 2px #5ee7ff18}.head{display:flex;justify-content:space-between;gap:15px}.room{color:var(--cyan);font-size:.76rem;font-weight:900;letter-spacing:.12em}.scene{min-height:210px;margin:20px 0;border:1px solid var(--line);border-radius:20px;background:radial-gradient(circle at 50% 30%,#1e2548,#080a13 72%);display:grid;place-items:center;padding:20px;position:relative}.door{width:120px;height:170px;border:6px solid #5a6489;border-radius:12px;background:#20253b;display:grid;place-items:center;font-weight:900}.puzzle{padding:18px;border:1px solid var(--line);border-radius:16px;background:#0c1020}.row{display:flex;gap:8px;margin-top:12px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}.choice{padding:14px;text-align:left;border:1px solid var(--line);border-radius:13px;background:#11162a;color:#fff}.choice:hover{border-color:var(--cyan)}.msg{min-height:24px;margin-top:10px;font-weight:800}.bad{color:var(--red)}.good{color:var(--green)}.memory{font-size:2.2rem;letter-spacing:.3em}.system{padding:14px;border:1px solid #244c43;border-radius:12px;background:#050a0a;color:var(--green);font-family:monospace;text-align:left}.tiny{font-size:.76rem;color:#697395;margin-top:18px}.toast{position:fixed;top:85px;left:50%;transform:translateX(-50%);z-index:50;padding:12px 18px;border:1px solid var(--pink);border-radius:12px;background:#170b18;box-shadow:0 12px 50px #000;color:#fff}.shake{animation:shake .25s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}.hidden-dot{position:absolute;right:7%;top:7%;width:20px;height:20px;border:0;background:transparent;opacity:.03}.footer{margin-top:22px;font-size:.7rem;color:#596281}@media(max-width:650px){.diffs,.choices{grid-template-columns:1fr}.row{flex-direction:column}.top{height:auto;padding:12px 0}.hud .pill:nth-child(2){display:none}.card{border-radius:22px;padding:22px 16px}.memory{font-size:1.65rem}}
</style>
</head>
<body>
<header class="wrap top">
<div class="brand">🧪 AKTER CRAZY LAB</div>
<div class="hud"><span class="pill">ROOM <b id="room">0</b>/6</span><span class="pill">TIME <b id="time">10:00</b></span><span class="pill">❤️ <b id="lives">3</b></span><span class="pill">💡 <b id="hints">2</b></span><button class="btn" id="sound">🔊</button></div>
</header>
<main class="screen"><section class="card" id="app"></section></main>
<script>
'use strict';
const app=document.getElementById('app'),cfg={chill:{time:720,lives:5,hints:3,label:'😎 CHILL'},normal:{time:600,lives:3,hints:2,label:'🧠 NORMAL'},insane:{time:420,lives:2,hints:1,label:'☠️ INSANE'}};
let S={room:0,time:600,lives:3,hints:2,score:0,diff:'normal',player:'',started:false,perfect:true,hintsUsed:0,items:[],ach:[],eggs:0};
try{S={...S,...JSON.parse(localStorage.getItem('escapeV5')||'null')}}catch(e){}
let timer=null,selected=S.diff||'normal';
function save(){localStorage.setItem('escapeV5',JSON.stringify(S))}
function fmt(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function hud(){document.getElementById('room').textContent=S.room;document.getElementById('time').textContent=fmt(S.time);document.getElementById('lives').textContent=S.lives;document.getElementById('hints').textContent=S.hints;document.getElementById('sound').textContent=localStorage.getItem('mute')==='1'?'🔇':'🔊'}
function beep(f=600){if(localStorage.getItem('mute')==='1')return;try{const C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.08)}catch(e){}}
function draw(html){app.innerHTML=html;hud()}
function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}
function award(id,title){if(!S.ach.includes(id)){S.ach.push(id);S.score+=75;save();toast('🏆 '+title)}}
function fail(msg){S.lives--;S.perfect=false;save();const m=document.querySelector('.msg');if(m){m.textContent=msg+'  ❤️ '+S.lives+' lives left';m.className='msg bad'}beep(120);if(S.lives<=0){setTimeout(badEnd,250);return false}return true}
function useHint(text){if(S.hints<1){toast('💡 No hints left');return}S.hints--;S.hintsUsed++;S.perfect=false;S.score=Math.max(0,S.score-50);save();const m=document.querySelector('.msg');if(m){m.textContent='💡 '+text;m.className='msg good'}hud()}
function startScreen(){
draw('<div class="center"><div class="eyebrow">V5 • THE WEBSITE IS ALIVE</div><h1 class="title">ESCAPE<br>THE WEBSITE</h1><p class="subtitle">A browser escape-room where the page can lie, glitch, remember you and hide multiple endings.</p><div class="name"><input class="input" id="name" maxlength="18" placeholder="Enter your codename (optional)" value="'+(S.player||'')+'"></div><div class="diffs"><button class="diff" data-d="chill"><b>😎 CHILL</b><small>12 min • 5 lives • 3 hints</small></button><button class="diff" data-d="normal"><b>🧠 NORMAL</b><small>10 min • 3 lives • 2 hints</small></button><button class="diff" data-d="insane"><b>☠️ INSANE</b><small>7 min • 2 lives • 1 hint</small></button></div><div class="actions"><button class="btn primary" id="start">🚪 START GAME</button><button class="btn" id="how">❓ HOW TO PLAY</button><button class="btn" id="ach">🏆 ACHIEVEMENTS</button></div><div class="tiny">No download • Mobile friendly • Progress saved automatically</div><div class="footer">AKTER CRAZY LAB • Something is hiding here…</div></div>');
document.querySelectorAll('[data-d]').forEach(b=>{b.classList.toggle('active',b.dataset.d===selected);b.onclick=()=>{selected=b.dataset.d;document.querySelectorAll('[data-d]').forEach(x=>x.classList.toggle('active',x.dataset.d===selected));beep(480)}})
document.getElementById('start').onclick=()=>startGame();document.getElementById('how').onclick=how;document.getElementById('ach').onclick=achievements;
}
function startGame(){const c=cfg[selected];S={...S,room:1,time:c.time,lives:c.lives,hints:c.hints,score:0,diff:selected,player:(document.getElementById('name').value||'ESCAPER').trim(),started:true,perfect:true,hintsUsed:0,items:[],eggs:0};save();beep(800);room1();clearInterval(timer);timer=setInterval(()=>{if(!S.started)return;S.time--;if(S.time<=0){S.time=0;badEnd()}save();hud()},1000)}
function how(){draw('<div class="center"><div class="eyebrow">SURVIVAL GUIDE</div><h2>Look. Think. Click.</h2><p>Five rooms stand between you and freedom. Wrong answers cost lives. Hints cost points. Hidden objects can unlock another ending.</p><div class="system">> Observe every detail.<br>> Patterns matter.<br>> DO NOT TRUST every button.<br>> Search for hidden things.<br>> There is more than one ending.</div><br><button class="btn primary" id="back">← BACK</button></div>');document.getElementById('back').onclick=startScreen}
function achievements(){const a=[['first','First Blood'],['smart','No Mistakes'],['speed','Speed Demon'],['brain','Pure Brain'],['secret','Secret Hunter'],['insane','Madness'],['egg','Lab Rat'],['perfect','PERFECT RUN']];draw('<div class="center"><div class="eyebrow">YOUR TROPHIES</div><h2>Achievements</h2><div class="choices">'+a.map(x=>'<div class="choice '+(S.ach.includes(x[0])?'':'locked')+'">'+(S.ach.includes(x[0])?'🏆':'🔒')+' <b>'+x[1]+'</b></div>').join('')+'</div><br><button class="btn" id="back">← BACK</button></div>');document.getElementById('back').onclick=startScreen}
function room1(){S.room=1;save();draw('<div class="head"><div><div class="room">ROOM 01 — THE EMPTY ROOM</div><h2>Find the four-digit code.</h2></div>🔒</div><p>SCREEN gives the first digit. CLOCK gives the second. A hidden clue gives the last two.</p><div class="scene"><div class="door">01</div><div style="position:absolute;left:12px;bottom:12px"><span>SCREEN: 7</span> • <span>CLOCK: '+(S.diff==='insane'?'6':'3')+'</span><button class="btn" id="egg" style="opacity:.08">HIDDEN</button></div></div><div class="puzzle"><b>🔐 Enter code</b><div class="row"><input class="input" id="a" inputmode="numeric" maxlength="4" placeholder="4 digits"><button class="btn primary" id="go">UNLOCK</button></div><div class="msg"></div><button class="btn" id="hint">💡 Hint</button></div>');
document.getElementById('go').onclick=()=>{const good=S.diff==='insane'?'7691':'7341';if(document.getElementById('a').value.trim()===good){S.score+=100;S.items.push('Bronze Key');award('first','First Blood');S.room=2;save();room2()}else fail('Wrong code.')};document.getElementById('hint').onclick=()=>useHint('Order: SCREEN → CLOCK → HIDDEN.');document.getElementById('egg').onclick=()=>{S.eggs++;S.score+=30;save();toast('🥚 You found a hidden clue!');if(S.eggs>=2)award('egg','Lab Rat')}
}
function room2(){S.room=2;save();const insane=S.diff==='insane',opts=insane?[48,36,42,54]:[24,32,30,18];draw('<div class="head"><div><div class="room">ROOM 02 — THE CLOCK</div><h2>Follow the sequence.</h2></div>🕰️</div><div class="scene"><div style="font-size:3rem;font-weight:900">'+(insane?'3 → 6 → 12 → 24 → ?':'2 → 4 → 8 → 16 → ?')+'</div></div><div class="puzzle"><b>🧠 What comes next?</b><div class="choices">'+opts.map(v=>'<button class="choice" data-v="'+v+'">'+v+'</button>').join('')+'</div><div class="msg"></div><button class="btn" id="hint">💡 Hint</button></div>');document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const good=insane?48:32;if(+b.dataset.v===good){S.score+=150;S.items.push('Time Fragment');room3()}else fail('Wrong sequence.')});document.getElementById('hint').onclick=()=>useHint('Double the previous number.')}
function room3(){S.room=3;save();const sy=S.diff==='insane'?['🦉','🔥','🐉','🔑','🌙','⭐']:['🌙','🔥','🐉','🔑','⭐'];S.sy=sy;draw('<div class="head"><div><div class="room">ROOM 03 — MEMORY WALL</div><h2>Remember the third symbol.</h2></div>🧠</div><p>Memorize these symbols. They vanish after a few seconds.</p><div class="scene" id="mem"><div class="memory">'+sy.join(' ')+'</div></div><div class="puzzle" id="mp"><button class="btn primary" id="memgo">START MEMORY TEST</button></div>');document.getElementById('memgo').onclick=()=>{document.getElementById('memgo').disabled=true;setTimeout(()=>{document.getElementById('mem').innerHTML='<div class="memory">???</div>';document.getElementById('mp').innerHTML='<b>Which was the third?</b><div class="choices">'+sy.map(x=>'<button class="choice" data-s="'+x+'">'+x+'</button>').join('')+'</div><div class="msg"></div>';document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{if(b.dataset.s===S.sy[2]){S.score+=200;S.items.push('Dragon Sigil');room4()}else fail('Memory rejected that answer.')})},S.diff==='insane'?3000:4000)}
}
function room4(){S.room=4;save();draw('<div class="head"><div><div class="room">ROOM 04 — THE LIAR</div><h2>Exactly one statement is true.</h2></div>👁️</div><div class="puzzle"><p>🟥 A: The blue terminal is safe.</p><p>🟦 B: Statement A is false.</p><p>🟩 C: The green terminal is not safe.</p><b>Which terminal do you press?</b><div class="choices"><button class="choice" data-l="A">🟥 A</button><button class="choice" data-l="B">🟦 B</button><button class="choice" data-l="C">🟩 C</button></div><div class="msg"></div><button class="btn" id="hint">💡 Hint</button></div>');document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{if(b.dataset.l==='B'){S.score+=250;S.items.push('Truth Fragment');room5()}else fail('The terminal laughs.')});document.getElementById('hint').onclick=()=>useHint('Test the one-true-statement condition.')}
function room5(){S.room=5;save();draw('<div class="head"><div><div class="room">ROOM 05 — FINAL DOOR</div><h2>The password is hidden in your inventory.</h2></div>🚪</div><p>Take the first letter of each fragment.</p><div class="scene"><div class="door">EXIT</div></div><div class="puzzle"><b>🔑 Password: Bronze + Time + Dragon + Truth</b><div class="row"><input class="input" id="final" placeholder="four letters"><button class="btn primary" id="finish">ESCAPE</button></div><div class="msg"></div><button class="btn" id="hint">💡 Hint</button></div>');document.getElementById('finish').onclick=()=>{if(document.getElementById('final').value.trim().toLowerCase()==='btdt'){S.score+=500;S.room=6;save();finalRoom()}else fail('The final door rejects you.')};document.getElementById('hint').onclick=()=>useHint('B + T + D + T = BTDT.')}
function finalRoom(){S.room=6;save();draw('<div class="center"><div class="eyebrow">SECRET CORE</div><h2>One last choice, '+S.player+'.</h2><p>The obvious button is bait. Search the screen.</p><div class="scene"><button class="btn primary" id="bait">🚫 DO NOT CLICK ME</button><button class="hidden-dot" id="secret" aria-label="hidden exit"></button></div><div class="puzzle"><div class="msg" id="core">There may be another way out…</div></div></div>');document.getElementById('bait').onclick=()=>{document.getElementById('bait').textContent='😈 TOO LATE';document.getElementById('core').textContent='The website expected that. Now find the tiny hidden exit.';toast('😈 Trap activated')};document.getElementById('secret').onclick=secretEnd}
function secretEnd(){S.eggs++;award('secret','Secret Hunter');S.started=false;S.room=8;save();draw('<div class="center"><div style="font-size:5rem">🕵️</div><div class="eyebrow">SECRET ENDING</div><h1 class="title">BACKDOOR<br>FOUND</h1><p class="subtitle">You found the path the website tried to hide.</p><div class="system">> ACCESS: ROOT<br>> PLAYER: '+S.player+'<br>> STATUS: CLEVER</div><br><button class="btn primary" id="again">🔁 PLAY AGAIN</button> <button class="btn" id="menu">🏠 MENU</button></div>');document.getElementById('again').onclick=reset;document.getElementById('menu').onclick=startScreen}
function win(){S.started=false;award('smart','No Mistakes');if(S.hintsUsed===0)award('brain','Pure Brain');if(S.time>=180)award('speed','Speed Demon');if(S.diff==='insane')award('insane','Madness');if(S.perfect&&S.hintsUsed===0)award('perfect','PERFECT RUN');save();draw('<div class="center"><div style="font-size:5rem">🏆</div><div class="eyebrow">ESCAPE SUCCESSFUL</div><h1 class="title">'+S.player+'<br>ESCAPED!</h1><p class="subtitle">Time left: <b>'+fmt(S.time)+'</b> • Score: <b>'+S.score+'</b></p><button class="btn primary" id="again">🔁 PLAY AGAIN</button> <button class="btn" id="menu">🏠 MENU</button></div>');document.getElementById('again').onclick=reset;document.getElementById('menu').onclick=startScreen}
function badEnd(){clearInterval(timer);S.started=false;save();draw('<div class="center"><div style="font-size:5rem">⏰</div><div class="eyebrow">BAD ENDING</div><h2>The website won.</h2><p>Score: '+S.score+'</p><button class="btn primary" id="again">🔁 TRY AGAIN</button> <button class="btn" id="menu">🏠 MENU</button></div>');document.getElementById('again').onclick=reset;document.getElementById('menu').onclick=startScreen}
function reset(){clearInterval(timer);const keep=S.ach;S={room:0,time:600,lives:3,hints:2,score:0,diff:selected,player:'',started:false,perfect:true,hintsUsed:0,items:[],ach:keep,eggs:0};save();startScreen()}
document.getElementById('sound').onclick=()=>{localStorage.setItem('mute',localStorage.getItem('mute')==='1'?'0':'1');hud()}
if(S.started&&S.room>=1&&S.room<=5){selected=S.diff;({1:room1,2:room2,3:room3,4:room4,5:room5}[S.room])()}else if(S.room===6&&S.started){finalRoom()}else if(S.room===8){secretEnd()}else{S.started=false;startScreen()}
</script>
</body>
</html>
