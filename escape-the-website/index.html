<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070812">
<meta name="description" content="Escape The Website — a mysterious browser escape-room game by AKTER CRAZY LAB.">
<title>ESCAPE THE WEBSITE — AKTER CRAZY LAB</title>
<style>
:root{--bg:#070812;--panel:#101326;--panel2:#151a31;--text:#f5f7ff;--muted:#9da5c7;--cyan:#5ee7ff;--pink:#ff5ebc;--gold:#ffd166;--danger:#ff5d73;--ok:#67f5a5;--line:#283052;--shadow:0 24px 70px #0008}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#25285a 0,#0b0d1d 42%,#05060c 100%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(#ffffff03 1px,transparent 1px),linear-gradient(90deg,#ffffff03 1px,transparent 1px);background-size:40px 40px;mask-image:linear-gradient(to bottom,#000,transparent 90%)}
.wrap{width:min(1050px,92vw);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0}.brand{font-weight:900;letter-spacing:.08em;font-size:.85rem;color:var(--cyan)}.status{display:flex;gap:10px;align-items:center}.pill{border:1px solid var(--line);background:#0d1020cc;padding:7px 11px;border-radius:999px;font-size:.78rem;color:var(--muted)}.pill b{color:#fff}.screen{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:20px 0 60px}.card{width:min(760px,100%);background:linear-gradient(145deg,#11152af2,#090b16f2);border:1px solid #30385f;border-radius:28px;box-shadow:var(--shadow);padding:clamp(24px,5vw,52px);position:relative;overflow:hidden}.card:after{content:"";position:absolute;width:220px;height:220px;right:-100px;top:-100px;background:#5ee7ff12;border-radius:50%;filter:blur(8px)}
.center{text-align:center}.eyebrow{color:var(--pink);font-weight:800;letter-spacing:.16em;font-size:.72rem}.title{font-size:clamp(2.5rem,9vw,5.7rem);line-height:.9;margin:16px 0;background:linear-gradient(90deg,#fff,var(--cyan),#fff,var(--pink));background-size:300%;-webkit-background-clip:text;color:transparent;animation:shine 7s linear infinite}@keyframes shine{to{background-position:300%}}.subtitle{color:var(--muted);font-size:1rem;line-height:1.7;max-width:600px;margin:0 auto 28px}.btn{border:1px solid #3a456f;background:#171c34;color:#fff;border-radius:14px;padding:12px 18px;font-weight:800;transition:.2s;box-shadow:0 8px 20px #0003}.btn:hover{transform:translateY(-2px);border-color:var(--cyan)}.btn.primary{background:linear-gradient(135deg,#256d86,#5942a8);border-color:#68e9ff66}.btn.danger{border-color:#ff5d7355}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.tiny{font-size:.78rem;color:var(--muted);margin-top:20px}.game-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:25px}.room{color:var(--cyan);font-weight:900;letter-spacing:.12em;font-size:.78rem}.timer{font-variant-numeric:tabular-nums;font-weight:900;font-size:1.25rem;color:var(--gold)}.timer.danger{color:var(--danger);animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.45}}h2{font-size:clamp(1.5rem,5vw,2.5rem);margin:8px 0 10px}p{line-height:1.65;color:var(--muted)}.scene{min-height:230px;border:1px solid var(--line);border-radius:20px;background:radial-gradient(circle at 50% 30%,#1d2344,#090b15 70%);display:grid;place-items:center;padding:25px;margin:20px 0;position:relative}.door{width:125px;height:175px;border:6px solid #566083;border-radius:10px 10px 5px 5px;background:linear-gradient(90deg,#181b2e,#292e48);position:relative;box-shadow:inset 0 0 35px #000}.door:before{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:var(--gold);right:15px;top:90px;box-shadow:0 0 15px #ffd16699}.door span{position:absolute;left:50%;top:22px;transform:translateX(-50%);font-weight:900;color:#7782a8}.clue{display:inline-block;margin:6px;padding:8px 11px;border:1px dashed #4b5886;border-radius:10px;color:#aab5df;background:#0e1222}.clue.hidden{color:#0e1222;border-color:#0e1222;background:#0e1222;user-select:none}.clue.hidden:hover{color:var(--cyan);border-color:var(--cyan);background:#10172a}.puzzle{background:#0c1020;border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:18px}.inputrow{display:flex;gap:8px;margin-top:14px}.input{width:100%;background:#080a13;border:1px solid #374267;color:#fff;border-radius:12px;padding:12px 14px;outline:none}.input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #5ee7ff14}.msg{min-height:24px;margin-top:12px;font-weight:700}.msg.bad{color:var(--danger)}.msg.good{color:var(--ok)}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.choice{padding:14px;border-radius:14px;border:1px solid var(--line);background:#11162a;color:#fff;text-align:left}.choice:hover{border-color:var(--cyan);background:#151d36}.choice.used{opacity:.45;pointer-events:none}.inventory{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.item{font-size:.78rem;padding:7px 9px;border-radius:9px;background:#171d34;border:1px solid #313b62;color:#dfe5ff}.footer{text-align:center;color:#596281;font-size:.72rem;margin-top:24px}.shake{animation:shake .3s}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}.win{font-size:5rem;animation:float 2s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px)}}.meter{height:7px;background:#171b2d;border-radius:99px;overflow:hidden;margin:12px 0}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink));width:0;transition:width .4s}.glitch{animation:glitch .15s 3}@keyframes glitch{0%,100%{filter:none}50%{filter:hue-rotate(90deg) contrast(1.7);transform:translateX(2px)}}@media(max-width:600px){.top{padding:13px 0}.status .pill:nth-child(2){display:none}.card{border-radius:22px;padding:22px 17px}.choices{grid-template-columns:1fr}.inputrow{flex-direction:column}.scene{min-height:200px}.title{font-size:3.5rem}}
</style>
</head>
<body>
<div class="wrap top">
  <div class="brand">🧪 AKTER CRAZY LAB</div>
  <div class="status"><span class="pill">ROOM <b id="roomNo">0</b>/6</span><span class="pill">TIME <b id="topTime">10:00</b></span><button class="btn" id="soundBtn" type="button">🔊</button></div>
</div>
<main class="screen"><div class="card" id="app"></div></main>
<script>
const app=document.getElementById('app');
const roomNo=document.getElementById('roomNo');
const topTime=document.getElementById('topTime');
let state={room:0,time:600,score:0,items:[],used:[],sound:true,started:false,lives:3,hints:2,glitches:0};
try{const s=JSON.parse(localStorage.getItem('escapeWebsiteSave'));if(s)state={...state,...s}}catch(e){}
let timer=null,audioCtx=null;

function save(){localStorage.setItem('escapeWebsiteSave',JSON.stringify(state))}
function beep(freq=440,dur=.08,type='sine'){if(!state.sound)return;try{audioCtx??=new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.04,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}catch(e){}}
function format(t){let m=Math.floor(t/60),s=t%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function render(){roomNo.textContent=state.room;topTime.textContent=format(state.time);topTime.classList.toggle('danger',state.time<=60)}
function set(html){app.innerHTML=html;render()}
function startTimer(){clearInterval(timer);timer=setInterval(()=>{if(!state.started||state.room>=6)return;state.time--;if(Math.random()<0.02)glitch();if(state.time<=0){state.time=0;clearInterval(timer);timeout()}save();render()},1000)}
function glitch(){document.body.classList.add('glitch');beep(70,.08,'square');setTimeout(()=>document.body.classList.remove('glitch'),450)}
function loseLife(msg){state.lives--;save();if(state.lives<=0){clearInterval(timer);timeout();return false}const m=document.querySelector('.msg');if(m){m.textContent=msg+' ❤️ Lives left: '+state.lives;m.className='msg bad'}beep(120,.2,'square');return true}
function hint(text){if(state.hints<=0){alert('No hints left 😈');return}state.hints--;state.score=Math.max(0,state.score-50);save();const m=document.querySelector('.msg');if(m){m.textContent='💡 '+text;m.className='msg good'}}
function timeout(){beep(90,.5,'sawtooth');set('<div class="center"><div class="win">⏰</div><div class="eyebrow">TIME OUT</div><h2>The website won.</h2><p>You were <b>so close</b>. But the door is still locked. Try again with a sharper eye.</p><div class="actions"><button class="btn primary" onclick="resetGame()">🔁 Restart</button></div></div>')}
function resetGame(){state={room:0,time:600,score:0,items:[],used:[],sound:state.sound,started:false,lives:3,hints:2,glitches:0};save();clearInterval(timer);startScreen()}
function startGame(){state.started=true;state.room=1;state.time=600;state.score=0;state.items=[];state.used=[];state.lives=3;state.hints=2;state.glitches=0;save();beep(660,.12);startTimer();room1()}
function startScreen(){set('<div class="center"><div class="eyebrow">A BROWSER ESCAPE ROOM</div><h1 class="title">ESCAPE<br>THE WEBSITE</h1><p class="subtitle">You clicked somewhere you should not have clicked. Now the website has locked you inside. Six rooms. Hidden clues. One secret ending. <b>Good luck.</b></p><div class="actions"><button class="btn primary" onclick="startGame()">🚪 Enter the Website</button><button class="btn" onclick="how()">❓ How to play</button></div><div class="tiny">No downloads • Works on mobile • Your progress is saved on this device</div><div class="footer">A tiny experiment from AKTER CRAZY LAB</div></div>')}
function how(){set('<div class="center"><div class="eyebrow">SURVIVAL GUIDE</div><h2>Look. Think. Click.</h2><p>Search the room carefully. Some clues are obvious. Some are hiding in plain sight. Enter answers exactly when the puzzle asks for them.</p><div class="puzzle"><p>💡 <b>Tip:</b> The website may lie to you.</p><p>🔎 Hidden text can be revealed by interaction.</p><p>🧠 Not every clue is meant to be used immediately.</p><p>😈 If something looks suspicious… it probably is.</p></div><div class="actions"><button class="btn primary" onclick="startGame()">I'm ready</button><button class="btn" onclick="startScreen()">Back</button></div></div>')}

function room1(){
state.room=1;save();set('<div class="game-head"><div><div class="room">ROOM 01 — THE EMPTY ROOM</div><h2>The door has no key.</h2></div><div>🔒</div></div><p>A screen, a door and three suspicious pieces of information. Find the <b>four-digit code</b>.</p><div class="scene"><div class="door"><span>01</span></div><div style="position:absolute;left:12px;bottom:12px"><span class="clue">SCREEN: 7</span><span class="clue">CLOCK: 3</span><span class="clue hidden" title="You found something!">HIDDEN: 4</span></div></div><div class="puzzle"><b>🔐 What is the code?</b><p>Hint: Read the visible numbers, then inspect what the room is trying to hide.</p><div class="inputrow"><input class="input" id="a1" inputmode="numeric" maxlength="4" placeholder="Enter 4 digits"><button class="btn primary" onclick="check1()">Unlock</button></div><div class="msg" id="m1"></div></div>')}
function check1(){let v=document.getElementById('a1').value.trim();if(v==='7341'||v==='7344'){beep(880,.16);state.score+=100;state.items.push('🗝️ Bronze Key');state.room=2;save();setTimeout(room2,250)}else{if(!loseLife('Wrong code.'))return;beep(140,.2,'square');document.getElementById('m1').textContent='Nope. The room has more than three numbers…';document.getElementById('m1').className='msg bad';app.classList.remove('shake');void app.offsetWidth;app.classList.add('shake')}}

function room2(){state.room=2;save();set('<div class="game-head"><div><div class="room">ROOM 02 — THE CLOCK</div><h2>Time is telling you something.</h2></div><div>🕰️</div></div><p>The clock is frozen at <b>08:24</b>. Four buttons surround it. Only one is telling the truth.</p><div class="scene"><div style="font-size:4rem;font-weight:900;letter-spacing:.08em">08:24</div></div><div class="puzzle"><b>🧠 Which number comes next?</b><p>2 → 4 → 8 → 16 → ?</p><div class="choices"><button class="choice" onclick="answer2(this,24)">24</button><button class="choice" onclick="answer2(this,32)">32</button><button class="choice" onclick="answer2(this,30)">30</button><button class="choice" onclick="answer2(this,18)">18</button></div><div class="msg" id="m2"></div></div>')}
function answer2(el,v){if(v===32){beep(990,.16);el.classList.add('used');state.score+=150;state.items.push('🕰️ Time Fragment');state.room=3;save();setTimeout(room3,350)}else{if(!loseLife('Wrong sequence.'))return;beep(160,.15);document.getElementById('m2').textContent='Wrong. The sequence doubles each time.';document.getElementById('m2').className='msg bad'}}

function room3(){state.room=3;save();set('<div class="game-head"><div><div class="room">ROOM 03 — THE MEMORY WALL</div><h2>Remember before the lights go out.</h2></div><div>🧠</div></div><p>Memorize the symbols for <b>4 seconds</b>. Then they disappear.</p><div class="scene" id="memoryScene"><div style="font-size:2.2rem;letter-spacing:.5em">🌙 🔥 🐉 🔑 ⭐</div></div><div class="puzzle"><div id="memoryText"><b>Ready?</b><p>Press start. The symbols will vanish.</p><button class="btn primary" onclick="memoryStart()">Start memory test</button></div></div>')}
function memoryStart(){document.getElementById('memoryScene').innerHTML='<div style="font-size:2.2rem;letter-spacing:.5em">🌙 🔥 🐉 🔑 ⭐</div>';beep(520,.08);setTimeout(()=>{document.getElementById('memoryScene').innerHTML='<div style="font-size:3rem">???</div>';document.getElementById('memoryText').innerHTML='<b>Which symbol was third?</b><div class="choices"><button class="choice" onclick="memoryAnswer(this,\'🌙\')">🌙 Moon</button><button class="choice" onclick="memoryAnswer(this,\'🔥\')">🔥 Fire</button><button class="choice" onclick="memoryAnswer(this,\'🐉\')">🐉 Dragon</button><button class="choice" onclick="memoryAnswer(this,\'⭐\')">⭐ Star</button></div><div class="msg" id="m3"></div>'},4000)}
function memoryAnswer(el,v){if(v==='🐉'){beep(1040,.16);state.score+=200;state.items.push('🐉 Dragon Sigil');state.room=4;save();setTimeout(room4,350)}else{if(!loseLife('The memory wall rejects that answer.'))return;beep(130,.18);document.getElementById('m3').textContent='The memory wall rejects that answer.';document.getElementById('m3').className='msg bad'}}

function room4(){state.room=4;save();set('<div class="game-head"><div><div class="room">ROOM 04 — THE LIAR</div><h2>One statement is true.</h2></div><div>👁️</div></div><p>A strange terminal gives you three statements. One opens the final room.</p><div class="puzzle"><p>🟥 <b>A:</b> The blue button is safe.</p><p>🟦 <b>B:</b> Statement A is false.</p><p>🟩 <b>C:</b> The green button is not safe.</p><p style="margin-top:20px"><b>Only one statement is true.</b> Which button should you press?</p><div class="choices"><button class="choice" onclick="liar(this,\'A\')">🟥 A</button><button class="choice" onclick="liar(this,\'B\')">🟦 B</button><button class="choice" onclick="liar(this,\'C\')">🟩 C</button></div><div class="msg" id="m4"></div></div>')}
function liar(el,v){if(v==='B'){beep(1080,.2);state.score+=250;state.items.push('👁️ Truth Fragment');state.room=5;save();setTimeout(room5,350)}else{if(!loseLife('The terminal laughs. Try again.'))return;beep(110,.25,'sawtooth');document.getElementById('m4').textContent='The terminal laughs. Try the logic again.';document.getElementById('m4').className='msg bad'}}

function room5(){state.room=5;save();set('<div class="game-head"><div><div class="room">ROOM 05 — THE FINAL DOOR</div><h2>The website knows your score.</h2></div><div>🚪</div></div><p>Three fragments. One key. Enter the final password using the <b>first letters</b> of your collected items.</p><div class="inventory">'+state.items.map(x=>'<span class="item">'+x+'</span>').join('')+'</div><div class="scene"><div class="door"><span>EXIT</span></div></div><div class="puzzle"><b>🔑 Final password</b><p>Take the first letter of <b>Bronze</b>, <b>Time</b>, <b>Dragon</b>, and <b>Truth</b>.</p><div class="inputrow"><input class="input" id="final" maxlength="12" placeholder="Enter password"><button class="btn primary" onclick="finish()">Escape</button></div><div class="msg" id="mf"></div></div>')}
function finish(){let v=document.getElementById('final').value.trim().toLowerCase();if(v==='btdt'||v==='btdt'){beep(1200,.15);state.room=6;state.score+=500;state.started=true;save();clearInterval(timer);finalRoom()}else{beep(120,.3,'square');document.getElementById('mf').textContent='The door whispers: “First letters…”';document.getElementById('mf').className='msg bad'}}

function finalRoom(){state.room=6;save();set('<div class="center"><div class="eyebrow">SECRET ROOM — THE CORE</div><h2>Wait… you escaped?</h2><p>The website has one last question. <b>Do not trust the obvious button.</b></p><div class="scene"><button id="dontBtn" class="btn primary" style="font-size:1.2rem;padding:18px 28px" onclick="coreTrap()">DO NOT CLICK ME</button></div><div class="puzzle"><b>🧪 CORE CHECK</b><p>Click the button only when you are absolutely sure.</p><div class="msg" id="coreMsg"></div></div></div>');}
function coreTrap(){state.score+=100;beep(1000,.1);const b=document.getElementById('dontBtn');b.textContent='😈 TOO LATE';b.classList.add('danger');document.getElementById('coreMsg').innerHTML='The website expected that. Now find the <b>tiny hidden EXIT</b> somewhere on this screen.';const x=document.createElement('button');x.setAttribute('aria-label','secret exit');x.style='position:fixed;left:7%;bottom:6%;width:70px;height:25px;opacity:.02;background:transparent;border:0;cursor:pointer';x.onclick=()=>{x.remove();state.room=7;state.started=false;save();win()};document.body.appendChild(x)}
function win(){set('<div class="center"><div class="win">🏆</div><div class="eyebrow">ESCAPE SUCCESSFUL</div><h1 class="title" style="font-size:clamp(3rem,10vw,6rem)">YOU<br>ESCAPED!</h1><p class="subtitle">You beat the full escape sequence before the clock won. Final score: <b>'+state.score+'</b>.</p><div class="meter"><i style="width:'+Math.min(100,state.score/12)+'%"></i></div><div class="actions"><button class="btn primary" onclick="resetGame()">🔁 Play again</button><button class="btn" onclick="startScreen()">🏠 Main menu</button></div><div class="tiny">Secret ending hint: come back after escaping… the website may remember you. 👀</div></div>');beep(880,.12);setTimeout(()=>beep(1175,.18),130)}
document.getElementById('soundBtn').onclick=()=>{state.sound=!state.sound;document.getElementById('soundBtn').textContent=state.sound?'🔊':'🔇';save();if(state.sound)beep(660,.08)}
if(state.started&&state.room>0&&state.room<6){startTimer();({1:room1,2:room2,3:room3,4:room5,5:room5}[state.room])()}else if(state.room===6&&state.started){finalRoom()}else if(state.room===7){win()}else startScreen();
</script>
</body>
</html>
