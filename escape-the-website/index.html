<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070812">
<title>Escape The Website — AKTER CRAZY LAB</title>
<style>
:root{--bg:#070812;--card:#10152a;--line:#30385f;--text:#f7f8ff;--muted:#9da5c7;--cyan:#5ee7ff;--pink:#ff5ebc;--red:#ff5d73;--green:#67f5a5}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#292d63,#090b18 48%,#04050a);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}.wrap{width:min(980px,92vw);margin:auto}.top{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:900;color:var(--cyan);letter-spacing:.08em;font-size:.82rem}.hud{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.pill{padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:#0d1020;color:var(--muted);font-size:.75rem}.pill b{color:#fff}.screen{min-height:calc(100vh - 70px);display:grid;place-items:center;padding:18px 0 50px}.card{width:min(820px,100%);padding:clamp(22px,5vw,50px);border:1px solid #343d67;border-radius:28px;background:linear-gradient(145deg,#12162bf5,#080a13f5);box-shadow:0 25px 80px #0008}.center{text-align:center}.eyebrow{color:var(--pink);font-size:.72rem;font-weight:900;letter-spacing:.17em}.title{font-size:clamp(3rem,10vw,6rem);line-height:.88;margin:17px 0;background:linear-gradient(90deg,#fff,var(--cyan),#fff,var(--pink));-webkit-background-clip:text;color:transparent;background-size:300%;animation:shine 6s linear infinite}@keyframes shine{to{background-position:300%}}h2{font-size:clamp(1.6rem,5vw,2.6rem);margin:8px 0}p{color:var(--muted);line-height:1.65}.subtitle{max-width:650px;margin:0 auto 25px}.btn{border:1px solid #3c4772;background:#171c34;color:#fff;border-radius:14px;padding:12px 18px;font-weight:800;transition:.18s}.btn:hover{transform:translateY(-2px);border-color:var(--cyan)}.primary{background:linear-gradient(135deg,#226d86,#5a42a9);border-color:#5ee7ff66}.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.input{width:100%;background:#080a13;border:1px solid #39456d;color:#fff;border-radius:12px;padding:13px;outline:0}.input:focus{border-color:var(--cyan)}.name{max-width:430px;margin:0 auto 12px}.diffs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:680px;margin:15px auto 22px}.diff{padding:15px;text-align:left;border:1px solid var(--line);border-radius:15px;background:#0d1121;color:#fff}.diff small{display:block;color:var(--muted);margin-top:4px}.diff.active{border-color:var(--cyan);box-shadow:0 0 0 2px #5ee7ff18}.head{display:flex;justify-content:space-between;gap:15px}.room{color:var(--cyan);font-size:.76rem;font-weight:900;letter-spacing:.12em}.scene{min-height:210px;margin:20px 0;border:1px solid var(--line);border-radius:20px;background:radial-gradient(circle at 50% 30%,#1e2548,#080a13 72%);display:grid;place-items:center;padding:20px;position:relative}.door{width:120px;height:170px;border:6px solid #5a6489;border-radius:12px;background:#20253b;display:grid;place-items:center;font-weight:900}.puzzle{padding:18px;border:1px solid var(--line);border-radius:16px;background:#0c1020}.row{display:flex;gap:8px;margin-top:12px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}.choice{padding:14px;text-align:left;border:1px solid var(--line);border-radius:13px;background:#11162a;color:#fff}.choice:hover{border-color:var(--cyan);transform:translateY(-1px)}.msg{min-height:24px;margin-top:10px;font-weight:800}.bad{color:var(--red)}.good{color:var(--green)}.memory{font-size:2.2rem;letter-spacing:.3em}.system{padding:14px;border:1px solid #244c43;border-radius:12px;background:#050a0a;color:var(--green);font-family:monospace;text-align:left}.tiny{font-size:.76rem;color:#697395;margin-top:18px}.toast{position:fixed;top:85px;left:50%;transform:translateX(-50%);z-index:50;padding:12px 18px;border:1px solid var(--pink);border-radius:12px;background:#170b18;box-shadow:0 12px 50px #000;color:#fff}.hidden-dot{position:absolute;right:7%;top:7%;width:24px;height:24px;border:0;background:transparent;opacity:.035}.code-clue{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.clue{padding:12px;border:1px solid var(--line);border-radius:12px;background:#0b0f1e}.clue b{display:block;color:var(--cyan);font-size:1.2rem}.footer{margin-top:22px;font-size:.7rem;color:#596281}@media(max-width:650px){.diffs,.choices{grid-template-columns:1fr}.code-clue{grid-template-columns:repeat(2,1fr)}.row{flex-direction:column}.top{padding:12px 0}.hud .pill:nth-child(2){display:none}.card{border-radius:22px;padding:22px 16px}.memory{font-size:1.65rem}}
</style>
</head>
<body>
<header class="wrap top"><div class="brand">🧪 AKTER CRAZY LAB</div><div class="hud"><span class="pill">ROOM <b id="room">0</b>/6</span><span class="pill">TIME <b id="time">10:00</b></span><span class="pill">❤️ <b id="lives">3</b></span><span class="pill">💡 <b id="hints">2</b></span><button class="btn" id="sound">🔊</button></div></header>
<main class="screen"><section class="card" id="app"></section></main>
<script>
'use strict';
const app=document.getElementById('app'),cfg={chill:{time:720,lives:5,hints:3},normal:{time:600,lives:3,hints:2},insane:{time:420,lives:2,hints:1}};
let S={room:0,time:600,lives:3,hints:2,score:0,diff:'normal',player:'',started:false,perfect:true,hintsUsed:0,ach:[],eggs:0};try{S={...S,...JSON.parse(localStorage.getItem('escapeFinal')||'null')}}catch(e){}let timer=null,selected=S.diff||'normal';
const save=()=>localStorage.setItem('escapeFinal',JSON.stringify(S));const fmt=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
function hud(){room.textContent=S.room;time.textContent=fmt(S.time);lives.textContent=S.lives;hints.textContent=S.hints;sound.textContent=localStorage.getItem('mute')==='1'?'🔇':'🔊'}
function beep(f=600){if(localStorage.getItem('mute')==='1')return;try{const C=AudioContext||webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.08)}catch(e){}}
function draw(x){app.innerHTML=x;hud()}function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}
function award(id,title){if(!S.ach.includes(id)){S.ach.push(id);S.score+=75;save();toast('🏆 '+title)}}
function fail(msg){S.lives--;S.perfect=false;save();const m=document.querySelector('.msg');if(m){m.textContent=msg+' • ❤️ '+S.lives+' lives left';m.className='msg bad'}beep(120);if(S.lives<=0)setTimeout(badEnd,300)}
function hint(text){if(!S.hints){toast('💡 No hints left');return}S.hints--;S.hintsUsed++;S.perfect=false;S.score=Math.max(0,S.score-50);save();const m=document.querySelector('.msg');if(m){m.textContent='💡 '+text;m.className='msg good'}hud()}
function startScreen(){draw('<div class="center"><div class="eyebrow">FINAL EDITION • THE WEBSITE IS ALIVE</div><h1 class="title">ESCAPE<br>THE WEBSITE</h1><p class="subtitle">A browser escape-room full of clues, traps, secrets and multiple endings.</p><div class="name"><input class="input" id="name" maxlength="18" placeholder="Enter your codename (optional)" value="'+(S.player||'')+'"></div><div class="diffs"><button class="diff" data-d="chill"><b>😎 CHILL</b><small>12 min • 5 lives • 3 hints</small></button><button class="diff" data-d="normal"><b>🧠 NORMAL</b><small>10 min • 3 lives • 2 hints</small></button><button class="diff" data-d="insane"><b>☠️ INSANE</b><small>7 min • 2 lives • 1 hint</small></button></div><div class="actions"><button class="btn primary" id="start">🚪 START GAME</button><button class="btn" id="how">❓ HOW TO PLAY</button><button class="btn" id="ach">🏆 ACHIEVEMENTS</button></div><div class="tiny">No download • Mobile friendly • Progress saved automatically</div><div class="footer">AKTER CRAZY LAB • Something is hiding here…</div></div>');document.querySelectorAll('[data-d]').forEach(b=>{b.classList.toggle('active',b.dataset.d===selected);b.onclick=()=>{selected=b.dataset.d;document.querySelectorAll('[data-d]').forEach(x=>x.classList.toggle('active',x.dataset.d===selected));beep(480)}});start.onclick=startGame;how.onclick=howTo;ach.onclick=achievements}
function startGame(){const c=cfg[selected];S={...S,room:1,time:c.time,lives:c.lives,hints:c.hints,score:0,diff:selected,player:(name.value||'ESCAPER').trim(),started:true,perfect:true,hintsUsed:0,eggs:0};save();clearInterval(timer);timer=setInterval(()=>{if(!S.started)return;if(--S.time<=0){S.time=0;badEnd()}save();hud()},1000);beep(800);room1()}
function howTo(){draw('<div class="center"><div class="eyebrow">SURVIVAL GUIDE</div><h2>Look. Think. Click.</h2><p>Five puzzle rooms stand between you and freedom. Wrong answers cost lives. Hints cost points. Hidden objects can unlock another ending.</p><div class="system">> Read every clue carefully.<br>> Patterns matter.<br>> Some buttons are traps.<br>> Search for hidden things.<br>> There is more than one ending.</div><br><button class="btn primary" id="back">← BACK</button></div>');back.onclick=startScreen}
function achievements(){const a=[['first','First Blood'],['smart','No Mistakes'],['speed','Speed Demon'],['brain','Pure Brain'],['secret','Secret Hunter'],['insane','Madness'],['egg','Lab Rat'],['perfect','PERFECT RUN']];draw('<div class="center"><div class="eyebrow">YOUR TROPHIES</div><h2>Achievements</h2><div class="choices">'+a.map(x=>'<div class="choice">'+(S.ach.includes(x[0])?'🏆':'🔒')+' <b>'+x[1]+'</b></div>').join('')+'</div><br><button class="btn" id="back">← BACK</button></div>');back.onclick=startScreen}
function room1(){S.room=1;save();const insane=S.diff==='insane';draw('<div class="head"><div><div class="room">ROOM 01 — THE EMPTY ROOM</div><h2>Find the four-digit code.</h2></div>🔐</div><p>Easy mode clue: take the four numbers <b>from left to right</b>.</p><div class="code-clue"><div class="clue"><b>7</b>SCREEN</div><div class="clue"><b>'+(insane?'6':'3')+'</b>CLOCK</div><div class="clue"><b>4</b>STAR</div><div class="clue"><b>1</b>DOOR</div></div><div class="scene"><div class="door">01</div></div><div class="puzzle"><b>🔑 Your code is:</b><div class="row"><input class="input" id="code" inputmode="numeric" maxlength="4" placeholder="Type 4 digits"><button class="btn primary" id="unlock">UNLOCK</button></div><div class="msg"></div><button class="btn" id="hint">💡 Hint</button></div>');unlock.onclick=()=>{const good=insane?'7641':'7341';if(code.value.trim()===good){S.score+=100;award('first','First Blood');S.room=2;save();room2()}else fail('Not quite. Read the four clue boxes left → right.')};hint.onclick=()=>hint('Just join the four numbers from left to right.');}
function room2(){S.room=2;save();const insane=S.diff==='insane',opts=insane?[48,36,42,54]:[24,32,30,18];draw('<div class="head"><div><div class="room">ROOM 02 — THE CLOCK</div><h2>Follow the sequence.</h2></div>🕰️</div><div class="scene"><div style="font-size:3rem;font-weight:900">'+(insane?'3 → 6 → 12 → 24 → ?':'2 → 4 → 8 → 16 → ?')+'</div></div><div class="puzzle"><b>🧠 What comes next?</b><div class="choices">'+opts.map(v=>'<button class="choice" data-v="'+v+'">'+v+'</button>').join('')+'</div><div class="msg"></div><button class="btn" id="hint">💡 Hint</button></div>');document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{if(+b.dataset.v===(insane?48:32)){S.score+=150;room3()}else fail('Wrong sequence.')});hint.onclick=()=>hint('Double the previous number.')}
function room3(){S.room=3;save();const sy=S.diff==='insane'?['🦉','🔥','🐉','🔑','🌙','⭐']:['🌙','🔥','🐉','🔑','⭐'];S.sy=sy;draw('<div class="head"><div><div class="room">ROOM 03 — MEMORY WALL</div><h2>Remember the third symbol.</h2></div>🧠</div><p>Memorize the symbols. They disappear when you start.</p><div class="scene" id="mem"><div class="memory">'+sy.join(' ')+'</div></div><div class="puzzle"><button class="btn primary" id="begin">START MEMORY TEST</button><div id="answers"></div></div>');begin.onclick=()=>{begin.disabled=true;setTimeout(()=>{mem.innerHTML='<div class="memory">???</div>';answers.innerHTML='<b>Which symbol was third?</b><div class="choices">'+sy.map(x=>'<button class="choice" data-s="'+x+'">'+x+'</button>').join('')+'</div><div class="msg"></div>';document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{if(b.dataset.s===S.sy[2]){S.score+=200;room4()}else fail('Memory rejected that symbol.')})},S.diff==='insane'?2800:3800)}}
function room4(){S.room=4;save();draw('<div class="head"><div><div class="room">ROOM 04 — THE LIAR</div><h2>Choose the truthful terminal.</h2></div>👁️</div><div class="puzzle"><p>Exactly one statement is true.</p><p>🟥 A: The blue terminal is safe.</p><p>🟦 B: Statement A is false.</p><p>🟩 C: The green terminal is not safe.</p><div class="choices"><button class="choice" data-l="A">🟥 A</button><button class="choice" data-l="B">🟦 B</button><button class="choice" data-l="C">🟩 C</button></div><div class="msg"></div><button class="btn" id="hint">💡 Hint</button></div>');document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{if(b.dataset.l==='B'){S.score+=250;room5()}else fail('The terminal laughs. Try again.')});hint.onclick=()=>hint('Only B makes the truth condition consistent.')}
function room5(){S.room=5;save();draw('<div class="head"><div><div class="room">ROOM 05 — FINAL DOOR</div><h2>Use the four fragments.</h2></div>🚪</div><p>Take the first letter of each item:</p><div class="code-clue"><div class="clue"><b>B</b>Bronze</div><div class="clue"><b>T</b>Time</div><div class="clue"><b>D</b>Dragon</div><div class="clue"><b>T</b>Truth</div></div><div class="puzzle"><b>🔑 Enter the four-letter password.</b><div class="row"><input class="input" id="finalCode" maxlength="4" placeholder="BTDT"><button class="btn primary" id="escape">ESCAPE</button></div><div class="msg"></div><button class="btn" id="hint">💡 Hint</button></div>');escape.onclick=()=>{if(finalCode.value.trim().toUpperCase()==='BTDT'){S.score+=500;S.room=6;save();finalRoom()}else fail('The door rejects that password.')};hint.onclick=()=>hint('Bronze + Time + Dragon + Truth = B T D T.')}
function finalRoom(){S.room=6;save();draw('<div class="center"><div class="eyebrow">ROOM 06 — THE SECRET CORE</div><h2>You made it to the exit, '+S.player+'.</h2><p>Take the normal exit… or search for something the website does not want you to find.</p><div class="scene"><button class="btn primary" id="normalExit">🏆 TAKE THE EXIT</button><button class="hidden-dot" id="secret" aria-label="hidden exit"></button></div><div class="puzzle"><div class="msg">There is a tiny secret somewhere in this room…</div></div></div>');normalExit.onclick=win;secret.onclick=secretEnd}
function win(){clearInterval(timer);S.started=false;award('smart','No Mistakes');if(S.hintsUsed===0)award('brain','Pure Brain');if(S.time>=180)award('speed','Speed Demon');if(S.diff==='insane')award('insane','Madness');if(S.perfect&&S.hintsUsed===0)award('perfect','PERFECT RUN');save();draw('<div class="center"><div style="font-size:5rem">🏆</div><div class="eyebrow">ESCAPE SUCCESSFUL</div><h1 class="title">'+S.player+'<br>ESCAPED!</h1><p class="subtitle">Time left: <b>'+fmt(S.time)+'</b> • Score: <b>'+S.score+'</b></p><button class="btn primary" id="again">🔁 PLAY AGAIN</button> <button class="btn" id="menu">🏠 MENU</button></div>');again.onclick=reset;menu.onclick=startScreen}
function secretEnd(){clearInterval(timer);S.started=false;S.eggs++;award('secret','Secret Hunter');save();draw('<div class="center"><div style="font-size:5rem">🕵️</div><div class="eyebrow">SECRET ENDING</div><h1 class="title">BACKDOOR<br>FOUND</h1><p class="subtitle">You found the path the website tried to hide.</p><div class="system">> ACCESS: ROOT<br>> PLAYER: '+S.player+'<br>> STATUS: CLEVER</div><br><button class="btn primary" id="again">🔁 PLAY AGAIN</button> <button class="btn" id="menu">🏠 MENU</button></div>');again.onclick=reset;menu.onclick=startScreen}
function badEnd(){clearInterval(timer);S.started=false;save();draw('<div class="center"><div style="font-size:5rem">⏰</div><div class="eyebrow">BAD ENDING</div><h2>The website won.</h2><p>Score: '+S.score+'</p><button class="btn primary" id="again">🔁 TRY AGAIN</button> <button class="btn" id="menu">🏠 MENU</button></div>');again.onclick=reset;menu.onclick=startScreen}
function reset(){clearInterval(timer);const keep=S.ach;S={room:0,time:600,lives:3,hints:2,score:0,diff:selected,player:'',started:false,perfect:true,hintsUsed:0,ach:keep,eggs:0};save();startScreen()}
sound.onclick=()=>{localStorage.setItem('mute',localStorage.getItem('mute')==='1'?'0':'1');hud()};
if(S.started&&S.room>=1&&S.room<=5){selected=S.diff;({1:room1,2:room2,3:room3,4:room4,5:room5}[S.room])()}else if(S.started&&S.room===6)finalRoom();else{S.started=false;startScreen()}
</script></body></html>
