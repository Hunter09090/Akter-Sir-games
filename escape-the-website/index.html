<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b16">
<title>Escape The Website</title>
<style>
:root{--bg:#070a12;--panel:#101626;--panel2:#0b1020;--line:#273451;--text:#f7f9ff;--muted:#9ca8c4;--cyan:#58e6ff;--pink:#ff63bb;--green:#65f3a0;--red:#ff647c}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#17203c 0,#070a12 48%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}.shell{width:min(980px,100%);margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-weight:900;letter-spacing:.08em;color:var(--cyan)}.back{color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:8px 12px;border-radius:10px}.hud{display:none;gap:8px;flex-wrap:wrap;justify-content:center}.hud.show{display:flex}.stat{border:1px solid var(--line);background:#0d1323;padding:8px 12px;border-radius:999px;font-size:12px;color:var(--muted)}.stat b{color:var(--text)}main{padding:28px 0 60px}.screen{width:min(760px,100%);margin:20px auto;padding:clamp(24px,6vw,55px);background:linear-gradient(145deg,#11182a,#0c1120);border:1px solid var(--line);border-radius:28px;box-shadow:0 25px 80px #0009;text-align:center}.hidden{display:none!important}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.24em;color:var(--pink)}h1{font-size:clamp(48px,11vw,96px);line-height:.86;margin:18px 0;background:linear-gradient(90deg,#fff,var(--cyan),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}h2{font-size:clamp(25px,5vw,40px);margin:10px 0}p{color:var(--muted);line-height:1.65}.subtitle{max-width:560px;margin:0 auto 24px}.modes{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:22px 0}.mode,.btn{font:inherit;font-weight:850;color:var(--text);background:#151d32;border:1px solid #344260;border-radius:12px;padding:12px 16px;cursor:pointer}.mode.active,.btn.primary{background:linear-gradient(135deg,#166b83,#55398f);border-color:var(--cyan)}.mode:hover,.btn:hover{filter:brightness(1.16);transform:translateY(-1px)}.start{font-size:20px;padding:17px 30px;min-width:230px;box-shadow:0 0 38px #58e6ff20}.input{width:min(390px,100%);font:inherit;color:var(--text);background:#070b15;border:1px solid #344260;border-radius:12px;padding:13px 14px;outline:none}.input:focus{border-color:var(--cyan)}.puzzle{margin-top:22px;padding:22px;border:1px solid var(--line);border-radius:18px;background:var(--panel2)}.clues{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:18px 0}.clue{padding:15px 8px;border:1px solid var(--line);border-radius:13px;background:#0c1221;color:var(--muted)}.clue b{display:block;font-size:28px;color:var(--cyan);margin-bottom:4px}.choices{display:grid;gap:9px;margin-top:16px}.choice{width:100%;text-align:left;font:inherit;font-weight:750;color:var(--text);background:#121a2d;border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer}.choice:hover{border-color:var(--cyan);background:#17223a}.message{min-height:26px;margin:14px 0 0;font-weight:800}.good{color:var(--green)}.bad{color:var(--red)}.progress{height:5px;background:#171e31;border-radius:99px;overflow:hidden;margin:18px 0}.progress i{display:block;height:100%;width:20%;background:linear-gradient(90deg,var(--cyan),var(--pink));transition:width .3s}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}.tip{font-size:12px;color:#7784a4;margin-top:15px}@media(max-width:600px){.shell{padding:13px}.top{align-items:flex-start}.brand{font-size:12px}.back{font-size:12px}.screen{margin-top:10px;padding:25px 16px;border-radius:21px}.clues{grid-template-columns:repeat(2,1fr)}h1{font-size:54px}}
</style>
</head>
<body>
<div class="shell">
<header class="top">
  <div class="brand">🧪 ESCAPE LAB</div>
  <a class="back" href="../">← Game Hub</a>
</header>
<div class="hud" id="hud">
  <span class="stat">ROOM <b id="roomNo">1</b>/5</span>
  <span class="stat">TIME <b id="clock">10:00</b></span>
  <span class="stat">❤️ <b id="lifeNo">3</b></span>
</div>
<main>
<section class="screen" id="startScreen">
  <div class="eyebrow">A BROWSER ESCAPE ROOM</div>
  <h1>ESCAPE<br>THE WEBSITE</h1>
  <p class="subtitle">The website has locked you inside. Solve five rooms, follow the clues and find the final password before time runs out.</p>
  <input class="input" id="playerName" maxlength="18" placeholder="Your name (optional)" autocomplete="off">
  <div class="modes">
    <button class="mode" data-mode="chill">😎 Chill</button>
    <button class="mode active" data-mode="normal">🧠 Normal</button>
    <button class="mode" data-mode="insane">☠️ Insane</button>
  </div>
  <button class="btn primary start" id="startButton" type="button">🚪 START GAME</button>
  <div class="tip">5 rooms · 3 lives · hidden tricks · no installation</div>
</section>

<section class="screen hidden" id="gameScreen">
  <div class="progress"><i id="progressBar"></i></div>
  <div id="roomContent"></div>
</section>

<section class="screen hidden" id="endScreen"></section>
</main>
</div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const startScreen=$('startScreen'),gameScreen=$('gameScreen'),endScreen=$('endScreen'),hud=$('hud'),roomContent=$('roomContent');
const settings={chill:{time:720,lives:5},normal:{time:600,lives:3},insane:{time:420,lives:2}};
let difficulty='normal',state=null,timer=null;
const normalCode='7341', insaneCode='7641';

function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function setScreen(which){startScreen.classList.toggle('hidden',which!=='start');gameScreen.classList.toggle('hidden',which!=='game');endScreen.classList.toggle('hidden',which!=='end');hud.classList.toggle('show',which==='game')}
function updateHud(){if(!state)return;$('roomNo').textContent=state.room;$('clock').textContent=fmt(state.time);$('lifeNo').textContent=state.lives;$('progressBar').style.width=(state.room*20)+'%'}
function message(text,good){const el=roomContent.querySelector('.message');if(el){el.textContent=text;el.className='message '+(good?'good':'bad')}}
function loseLife(text){state.lives--;updateHud();message(text+'  •  ❤️ '+state.lives+' left',false);if(state.lives<=0)setTimeout(()=>finish('💀 GAME OVER','You ran out of lives. The website wins this round.'),450)}
function tick(){if(!state)return;if(state.time<=1){state.time=0;updateHud();finish('⏰ TIME OUT','Time is up. The website locked the exit.');return}state.time--;updateHud()}
function start(){const s=settings[difficulty];state={room:1,time:s.time,lives:s.lives,name:($('playerName').value.trim()||'Escaper'),score:0};clearInterval(timer);timer=setInterval(tick,1000);setScreen('game');room1()}
function chooseMode(e){difficulty=e.currentTarget.dataset.mode;document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===difficulty))}
function room1(){const n=difficulty==='insane'?'6':'3';roomContent.innerHTML='<div class="eyebrow">ROOM 01 / 05</div><h2>🔐 Find the four-digit code</h2><p>Read the four blue numbers from <b>left to right</b>. That is your code.</p><div class="clues"><div class="clue"><b>7</b>SCREEN</div><div class="clue"><b>'+n+'</b>CLOCK</div><div class="clue"><b>4</b>STAR</div><div class="clue"><b>1</b>DOOR</div></div><div class="puzzle"><input class="input" id="answer1" inputmode="numeric" maxlength="4" placeholder="4-digit code"><div class="actions"><button class="btn primary" id="unlock1">🔓 Unlock</button><button class="btn" id="hint1">💡 Hint</button></div><div class="message"></div></div>';
$('unlock1').onclick=()=>{const ok=$('answer1').value.trim()===(difficulty==='insane'?insaneCode:normalCode);if(ok){state.score+=100;state.room=2;updateHud();room2()}else loseLife('Not quite. Read the numbers left → right.')};$('hint1').onclick=()=>message('💡 The four digits are simply '+(difficulty==='insane'?insaneCode:normalCode)+'.',true);$('answer1').focus();updateHud()}
function room2(){roomContent.innerHTML='<div class="eyebrow">ROOM 02 / 05</div><h2>🕰️ Crack the sequence</h2><p>What number comes next?</p><div class="puzzle"><h2>'+(difficulty==='insane'?'3 → 6 → 12 → 24 → ?':'2 → 4 → 8 → 16 → ?')+'</h2><div class="choices"><button class="choice" data-answer="32">32</button><button class="choice" data-answer="48">48</button><button class="choice" data-answer="24">24</button><button class="choice" data-answer="54">54</button></div><div class="message"></div></div>';
roomContent.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{const correct=difficulty==='insane'?'48':'32';if(b.dataset.answer===correct){state.score+=150;state.room=3;updateHud();room3()}else loseLife('Wrong. The pattern doubles each time.')})}
function room3(){const symbols=['🌙','🔥','🐉','🔑','⭐'];roomContent.innerHTML='<div class="eyebrow">ROOM 03 / 05</div><h2>🧠 Memory Wall</h2><p>Memorize the symbols. The third one matters.</p><div class="puzzle"><div style="font-size:44px;letter-spacing:8px">'+symbols.join(' ')+'</div><div class="actions"><button class="btn primary" id="memoryStart">START MEMORY TEST</button></div><div class="message"></div></div>';$('memoryStart').onclick=()=>{const p=roomContent.querySelector('.puzzle');p.innerHTML='<p><b>Which symbol was third?</b></p><div class="choices">'+symbols.map((s,i)=>'<button class="choice" data-symbol="'+i+'">'+s+'</button>').join('')+'</div><div class="message"></div>';p.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(b.dataset.symbol==='2'){state.score+=200;state.room=4;updateHud();room4()}else loseLife('Memory slipped. Try again.')})}}
function room4(){roomContent.innerHTML='<div class="eyebrow">ROOM 04 / 05</div><h2>👁️ The Truthful Terminal</h2><p>Exactly one statement is true. Choose the truthful statement.</p><div class="puzzle"><div class="choices"><button class="choice" data-v="A"><b>A.</b> The blue terminal is safe.</button><button class="choice" data-v="B"><b>B.</b> Statement A is false.</button><button class="choice" data-v="C"><b>C.</b> The green terminal is not safe.</button></div><div class="message"></div></div>';
roomContent.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(b.dataset.v==='B'){state.score+=250;state.room=5;updateHud();room5()}else loseLife('The terminal rejects that statement.')})}
function room5(){roomContent.innerHTML='<div class="eyebrow">ROOM 05 / 05</div><h2>🚪 The Final Password</h2><p>Take the first letter of each word:</p><p><b>Bronze · Time · Dragon · Truth</b></p><div class="puzzle"><input class="input" id="finalAnswer" maxlength="4" placeholder="4 letters" autocomplete="off"><div class="actions"><button class="btn primary" id="escapeButton">🚪 ESCAPE</button><button class="btn" id="finalHint">💡 Hint</button></div><div class="message"></div></div>';$('escapeButton').onclick=()=>{if($('finalAnswer').value.trim().toUpperCase()==='BTDT'){state.score+=500;finish('🏆 YOU ESCAPED!','Congratulations, '+state.name+'! You escaped the website with '+state.score+' points.')}else loseLife('Wrong password. Use the first letters.')};$('finalHint').onclick=()=>message('💡 Bronze + Time + Dragon + Truth = BTDT',true)}
function finish(title,text){clearInterval(timer);timer=null;const score=state?state.score:0;state=null;setScreen('end');endScreen.innerHTML='<div class="eyebrow">MISSION RESULT</div><h1>'+title+'</h1><p>'+text+'</p><p><b>Final score: '+score+'</b></p><div class="actions"><button class="btn primary start" id="again">🔁 PLAY AGAIN</button><button class="btn" id="menu">🏠 MAIN MENU</button></div>';$('again').onclick=()=>{setScreen('start');endScreen.classList.add('hidden');start()};$('menu').onclick=()=>{setScreen('start');$('playerName').focus()}}
document.querySelectorAll('.mode').forEach(b=>b.addEventListener('click',chooseMode));$('startButton').addEventListener('click',start);
setScreen('start');
})();
</script>
</body>
</html>
