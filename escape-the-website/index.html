<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070812"><title>Escape The Website — Final</title><style>:root{--bg:#070812;--card:#11162b;--line:#30385f;--text:#f7f8ff;--muted:#9da5c7;--cyan:#5ee7ff;--pink:#ff5ebc;--red:#ff5d73;--green:#67f5a5}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#292d63,#090b18 48%,#04050a);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}.wrap{width:min(920px,92vw);margin:auto}.top{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:900;color:var(--cyan);letter-spacing:.08em;font-size:.8rem}.hud{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.pill{padding:7px 10px;border:1px solid var(--line);border-radius:99px;background:#0d1020;color:var(--muted);font-size:.72rem}.pill b{color:#fff}.screen{min-height:calc(100vh - 68px);display:grid;place-items:center;padding:18px 0 45px}.card{width:min(820px,100%);padding:clamp(22px,5vw,48px);border:1px solid #343d67;border-radius:28px;background:linear-gradient(145deg,#12162bf5,#080a13f5);box-shadow:0 25px 80px #0008}.center{text-align:center}.eyebrow{color:var(--pink);font-size:.7rem;font-weight:900;letter-spacing:.17em}.title{font-size:clamp(3rem,10vw,6rem);line-height:.88;margin:16px 0;background:linear-gradient(90deg,#fff,var(--cyan),#fff,var(--pink));-webkit-background-clip:text;color:transparent;background-size:300%;animation:shine 6s linear infinite}@keyframes shine{to{background-position:300%}}h2{font-size:clamp(1.6rem,5vw,2.6rem);margin:8px 0}p{color:var(--muted);line-height:1.6}.subtitle{max-width:650px;margin:0 auto 24px}.btn{border:1px solid #3c4772;background:#171c34;color:#fff;border-radius:14px;padding:12px 18px;font-weight:800;transition:.18s}.btn:hover{transform:translateY(-2px);border-color:var(--cyan)}.primary{background:linear-gradient(135deg,#226d86,#5a42a9);border-color:#5ee7ff66}.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.input{width:100%;background:#080a13;border:1px solid #39456d;color:#fff;border-radius:12px;padding:13px;outline:0}.input:focus{border-color:var(--cyan)}.name{max-width:430px;margin:0 auto 12px}.diffs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:680px;margin:15px auto 22px}.diff{padding:15px;text-align:left;border:1px solid var(--line);border-radius:15px;background:#0d1121;color:#fff}.diff small{display:block;color:var(--muted);margin-top:4px}.diff.active{border-color:var(--cyan);box-shadow:0 0 0 2px #5ee7ff18}.head{display:flex;justify-content:space-between;gap:15px}.room{color:var(--cyan);font-size:.74rem;font-weight:900;letter-spacing:.12em}.scene{min-height:200px;margin:20px 0;border:1px solid var(--line);border-radius:20px;background:radial-gradient(circle at 50% 30%,#1e2548,#080a13 72%);display:grid;place-items:center;padding:20px}.door{width:120px;height:170px;border:6px solid #5a6489;border-radius:12px;background:#20253b;display:grid;place-items:center;font-weight:900}.puzzle{padding:18px;border:1px solid var(--line);border-radius:16px;background:#0c1020}.row{display:flex;gap:8px;margin-top:12px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}.choice{padding:14px;text-align:left;border:1px solid var(--line);border-radius:13px;background:#11162a;color:#fff}.choice:hover{border-color:var(--cyan)}.msg{min-height:24px;margin-top:10px;font-weight:800}.bad{color:var(--red)}.good{color:var(--green)}.memory{font-size:2.2rem;letter-spacing:.3em}.system{padding:14px;border:1px solid #244c43;border-radius:12px;background:#050a0a;color:var(--green);font-family:monospace;text-align:left}.tiny{font-size:.76rem;color:#697395;margin-top:18px}.toast{position:fixed;top:82px;left:50%;transform:translateX(-50%);z-index:50;padding:12px 18px;border:1px solid var(--pink);border-radius:12px;background:#170b18;box-shadow:0 12px 50px #000;color:#fff}.code{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.clue{padding:12px;border:1px solid var(--line);border-radius:12px;background:#0b0f1e}.clue b{display:block;color:var(--cyan);font-size:1.25rem}@media(max-width:650px){.diffs,.choices{grid-template-columns:1fr}.code{grid-template-columns:repeat(2,1fr)}.row{flex-direction:column}.card{border-radius:22px;padding:22px 16px}.memory{font-size:1.65rem}.top{padding:10px 0}.hud .pill:nth-child(n+2){display:none}}</style></head><body><header class="wrap top"><div class="brand">🧪 AKTER CRAZY LAB</div><div class="hud"><span class="pill">ROOM <b id="room">0</b>/5</span><span class="pill">TIME <b id="time">00:00</b></span><span class="pill">❤️ <b id="lives">0</b></span><span class="pill">💡 <b id="hints">0</b></span></div></header><main class="screen"><section class="card" id="app"></section></main><script>
'use strict';
const $=id=>document.getElementById(id),app=$('app'),cfg={chill:{time:720,lives:5,hints:3},normal:{time:600,lives:3,hints:2},insane:{time:420,lives:2,hints:1}};let game=null,timer=null,mode='normal';
function hud(){if(!game){$('room').textContent=0;$('time').textContent='00:00';$('lives').textContent=0;$('hints').textContent=0;return}$('room').textContent=game.room;$('time').textContent=fmt(game.time);$('lives').textContent=game.lives;$('hints').textContent=game.hints}function fmt(n){return String(Math.max(0,Math.floor(n/60))).padStart(2,'0')+':'+String(Math.max(0,n%60)).padStart(2,'0')}function draw(html){app.innerHTML=html;hud()}function beep(f=600){try{const C=AudioContext||webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.035;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.08)}catch(e){}}function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1800)}function menu(){clearInterval(timer);game=null;draw('<div class="center"><div class="eyebrow">FINAL EDITION • NO MORE BROKEN START</div><h1 class="title">ESCAPE<br>THE WEBSITE</h1><p class="subtitle">A browser escape-room full of clues, traps, secrets and multiple endings.</p><div class="name"><input class="input" id="player" maxlength="18" placeholder="Enter your codename (optional)"></div><div class="diffs"><button class="diff" data-mode="chill"><b>😎 CHILL</b><small>12 min • 5 lives • 3 hints</small></button><button class="diff active" data-mode="normal"><b>🧠 NORMAL</b><small>10 min • 3 lives • 2 hints</small></button><button class="diff" data-mode="insane"><b>☠️ INSANE</b><small>7 min • 2 lives • 1 hint</small></button></div><div class="actions"><button class="btn primary" id="start">🚪 START GAME</button><button class="btn" id="help">❓ HOW TO PLAY</button></div><div class="tiny">The game always opens at this menu. Progress never traps you on a level.</div></div>');document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));beep(450)});$('start').onclick=start;$('help').onclick=help}
function start(){const c=cfg[mode];game={room:1,time:c.time,lives:c.lives,hints:c.hints,score:0,name:($('player').value||'ESCAPER').trim(),perfect:true};clearInterval(timer);timer=setInterval(()=>{if(!game)return;if(--game.time<=0){game.time=0;hud();end(false,'⏰ TIME OUT','The website won this round.');return}hud()},1000);beep(850);room1()}
function help(){draw('<div class="center"><div class="eyebrow">HOW TO PLAY</div><h2>Look • Think • Escape</h2><p>Read the clue, solve the puzzle and move through five rooms. Wrong answers cost a life. Hints cost points. Finish quickly for a higher score.</p><div class="system">1. Read every clue.<br>2. Enter or choose the answer.<br>3. Watch your ❤️ lives and ⏱️ timer.<br>4. Reach the final door.</div><br><button class="btn primary" id="back">← BACK TO START</button></div>');$('back').onclick=menu}
function wrong(text){game.lives--;game.perfect=false;const m=document.querySelector('.msg');if(m){m.textContent=text+' • ❤️ '+game.lives+' left';m.className='msg bad'}beep(130);if(game.lives<=0)setTimeout(()=>end(false,'💀 GAME OVER','You ran out of lives.'),250);hud()}function hint(text){if(!game.hints){toast('No hints left');return}game.hints--;game.perfect=false;game.score=Math.max(0,game.score-50);const m=document.querySelector('.msg');if(m){m.textContent='💡 '+text;m.className='msg good'}hud()}
function room1(){const insane=mode==='insane';draw('<div class="head"><div><div class="room">ROOM 01 / 05</div><h2>Find the four-digit code</h2></div>🔐</div><p><b>Easy clue:</b> just take the four numbers <b>from left to right</b>.</p><div class="code"><div class="clue"><b>7</b>SCREEN</div><div class="clue"><b>'+(insane?'6':'3')+'</b>CLOCK</div><div class="clue"><b>4</b>STAR</div><div class="clue"><b>1</b>DOOR</div></div><div class="scene"><div class="door">01</div></div><div class="puzzle"><b>🔑 Enter the code</b><div class="row"><input class="input" id="answer" inputmode="numeric" maxlength="4" placeholder="Example: 1234"><button class="btn primary" id="go">UNLOCK</button></div><div class="msg"></div><button class="btn" id="hint">💡 Hint</button></div>');$('go').onclick=()=>{const right=insane?'7641':'7341';if($('answer').value.trim()===right){game.score+=100;room2()}else wrong('Not quite. Read the four boxes left → right.')};$('hint').onclick=()=>hint('Join the four visible numbers: 7, 3, 4, 1.')}
function room2(){const insane=mode==='insane';draw('<div class="head"><div><div class="room">ROOM 02 / 05</div><h2>Crack the sequence</h2></div>🕰️</div><div class="scene"><div style="font-size:2.8rem;font-weight:900">'+(insane?'3 → 6 → 12 → 24 → ?':'2 → 4 → 8 → 16 → ?')+'</div></div><div class="puzzle"><b>What comes next?</b><div class="choices">'+(insane?[48,36,42,54]:[32,24,30,18]).map(v=>'<button class="choice opt" data-v="'+v+'">'+v+'</button>').join('')+'</div><div class="msg"></div><button class="btn" id="hint">💡 Hint</button></div>');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(+b.dataset.v===(insane?48:32)){game.score+=150;room3()}else wrong('Wrong. Look at how the numbers change.')});$('hint').onclick=()=>hint('Each number is double the one before it.')}
function room3(){const sy=mode==='insane'?['🦉','🔥','🐉','🔑','🌙','⭐']:['🌙','🔥','🐉','🔑','⭐'];game.sy=sy;draw('<div class="head"><div><div class="room">ROOM 03 / 05</div><h2>Memory wall</h2></div>🧠</div><p>Memorize the symbols. Then answer the question.</p><div class="scene" id="memory"><div class="memory">'+sy.join(' ')+'</div></div><div class="puzzle"><button class="btn primary" id="memStart">START MEMORY TEST</button><div id="answers"></div></div>');$('memStart').onclick=()=>{setTimeout(()=>{$('memory').innerHTML='<div class="memory">???</div>';$('answers').innerHTML='<b>Which symbol was third?</b><div class="choices">'+sy.map(x=>'<button class="choice mem" data-s="'+x+'">'+x+'</button>').join('')+'</div><div class="msg"></div>';document.querySelectorAll('.mem').forEach(b=>b.onclick=()=>{if(b.dataset.s===sy[2]){game.score+=200;room4()}else wrong('Memory fail. Try again.')})},mode==='insane'?1800:2800)}
function room4(){draw('<div class="head"><div><div class="room">ROOM 04 / 05</div><h2>The truthful terminal</h2></div>👁️</div><div class="puzzle"><p>Exactly one statement is true.</p><p>🟥 A: The blue terminal is safe.</p><p>🟦 B: Statement A is false.</p><p>🟩 C: The green terminal is not safe.</p><div class="choices">'+['A','B','C'].map(x=>'<button class="choice liar" data-v="'+x+'">'+x+'</button>').join('')+'</div><div class="msg"></div><button class="btn" id="hint">💡 Hint</button></div>');document.querySelectorAll('.liar').forEach(b=>b.onclick=()=>{if(b.dataset.v==='B'){game.score+=250;room5()}else wrong('The terminal rejects your choice.')});$('hint').onclick=()=>hint('B is the statement that makes the logic consistent.')}
function room5(){draw('<div class="head"><div><div class="room">ROOM 05 / 05</div><h2>The final password</h2></div>🚪</div><p>Take the <b>first letter</b> of each word.</p><div class="code"><div class="clue"><b>B</b>Bronze</div><div class="clue"><b>T</b>Time</div><div class="clue"><b>D</b>Dragon</div><div class="clue"><b>T</b>Truth</div></div><div class="puzzle"><div class="row"><input class="input" id="answer" maxlength="4" placeholder="BTDT"><button class="btn primary" id="go">ESCAPE</button></div><div class="msg"></div><button class="btn" id="hint">💡 Hint</button></div>');$('go').onclick=()=>{if($('answer').value.trim().toUpperCase()==='BTDT'){game.score+=500;end(true,'🏆 ESCAPED!','You solved all five rooms, '+game.name+'.')}else wrong('The final door rejects that password.')};$('hint').onclick=()=>hint('Bronze + Time + Dragon + Truth = BTDT.')}
function end(win,title,text){clearInterval(timer);if(win&&game.perfect)game.score+=250;const score=game?game.score:0;draw('<div class="center"><div style="font-size:5rem">'+(win?'🏆':'💀')+'</div><div class="eyebrow">'+(win?'ESCAPE SUCCESSFUL':'RUN ENDED')+'</div><h1 class="title">'+title+'</h1><p class="subtitle">'+text+'<br><b>Score: '+score+'</b></p><div class="actions"><button class="btn primary" id="again">🔁 PLAY AGAIN</button><button class="btn" id="menu">🏠 MENU</button></div></div>');$('again').onclick=start;$('menu').onclick=menu;game=null;hud()}
// IMPORTANT: never resume a stale saved room. Every page load shows the Start Game screen.
menu();
</script></body></html>
