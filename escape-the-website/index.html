<style>
:root{--bg:#070812;--panel:#101326;--panel2:#151a31;--text:#f5f7ff;--muted:#9da5c7;--cyan:#5ee7ff;--pink:#ff5ebc;--gold:#ffd166;--danger:#ff5d73;--ok:#67f5a5;--line:#283052;--shadow:0 24px 70px #0008}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#25285a 0,#0b0d1d 42%,#05060c 100%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(#ffffff03 1px,transparent 1px),linear-gradient(90deg,#ffffff03 1px,transparent 1px);background-size:40px 40px;mask-image:linear-gradient(to bottom,#000,transparent 90%)}
.wrap{width:min(1050px,92vw);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;padding:18px 0}.brand{font-weight:900;letter-spacing:.08em;font-size:.85rem;color:var(--cyan)}.status{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.pill{border:1px solid var(--line);background:#0d1020cc;padding:7px 10px;border-radius:999px;font-size:.76rem;color:var(--muted)}.pill b{color:#fff}.screen{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:20px 0 60px}.card{width:min(820px,100%);background:linear-gradient(145deg,#11152af2,#090b16f2);border:1px solid #30385f;border-radius:28px;box-shadow:var(--shadow);padding:clamp(24px,5vw,52px);position:relative;overflow:hidden}.card:after{content:"";position:absolute;width:220px;height:220px;right:-100px;top:-100px;background:#5ee7ff12;border-radius:50%;filter:blur(8px)}
.center{text-align:center}.eyebrow{color:var(--pink);font-weight:800;letter-spacing:.16em;font-size:.72rem}.title{font-size:clamp(2.5rem,9vw,5.7rem);line-height:.9;margin:16px 0;background:linear-gradient(90deg,#fff,var(--cyan),#fff,var(--pink));background-size:300%;-webkit-background-clip:text;color:transparent;animation:shine 7s linear infinite}@keyframes shine{to{background-position:300%}}.subtitle{color:var(--muted);font-size:1rem;line-height:1.7;max-width:650px;margin:0 auto 28px}.btn{border:1px solid #3a456f;background:#171c34;color:#fff;border-radius:14px;padding:12px 18px;font-weight:800;transition:.2s;box-shadow:0 8px 20px #0003}.btn:hover{transform:translateY(-2px);border-color:var(--cyan)}.btn.primary{background:linear-gradient(135deg,#256d86,#5942a8);border-color:#68e9ff66}.btn.danger{border-color:#ff5d7355}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.tiny{font-size:.78rem;color:var(--muted);margin-top:20px}.game-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:25px}.room{color:var(--cyan);font-weight:900;letter-spacing:.12em;font-size:.78rem}.timer{font-variant-numeric:tabular-nums;font-weight:900;font-size:1.25rem;color:var(--gold)}.timer.danger{color:var(--danger);animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.45}}h2{font-size:clamp(1.5rem,5vw,2.5rem);margin:8px 0 10px}p{line-height:1.65;color:var(--muted)}.scene{min-height:230px;border:1px solid var(--line);border-radius:20px;background:radial-gradient(circle at 50% 30%,#1d2344,#090b15 70%);display:grid;place-items:center;padding:25px;margin:20px 0;position:relative}.door{width:125px;height:175px;border:6px solid #566083;border-radius:10px 10px 5px 5px;background:linear-gradient(90deg,#181b2e,#292e48);position:relative;box-shadow:inset 0 0 35px #000}.door:before{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:var(--gold);right:15px;top:90px;box-shadow:0 0 15px #ffd16699}.door span{position:absolute;left:50%;top:22px;transform:translateX(-50%);font-weight:900;color:#7782a8}.clue{display:inline-block;margin:6px;padding:8px 11px;border:1px dashed #4b5886;border-radius:10px;color:#aab5df;background:#0e1222}.clue.hidden{color:#0e1222;border-color:#0e1222;background:#0e1222;user-select:none}.clue.hidden:hover{color:var(--cyan);border-color:var(--cyan);background:#10172a}.puzzle{background:#0c1020;border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:18px}.inputrow{display:flex;gap:8px;margin-top:14px}.input{width:100%;background:#080a13;border:1px solid #374267;color:#fff;border-radius:12px;padding:12px 14px;outline:none}.input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #5ee7ff14}.msg{min-height:24px;margin-top:12px;font-weight:700}.msg.bad{color:var(--danger)}.msg.good{color:var(--ok)}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.choice{padding:14px;border-radius:14px;border:1px solid var(--line);background:#11162a;color:#fff;text-align:left}.choice:hover{border-color:var(--cyan);background:#151d36}.choice.used{opacity:.45;pointer-events:none}.inventory{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.item{font-size:.78rem;padding:7px 9px;border-radius:9px;background:#171d34;border:1px solid #313b62;color:#dfe5ff}.footer{text-align:center;color:#596281;font-size:.72rem;margin-top:24px}.shake{animation:shake .3s}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}.win{font-size:5rem;animation:float 2s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px)}}.meter{height:7px;background:#171b2d;border-radius:99px;overflow:hidden;margin:12px 0}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink));width:0;transition:width .4s}.glitch{animation:glitch .15s 3}@keyframes glitch{0%,100%{filter:none}50%{filter:hue-rotate(90deg) contrast(1.7);transform:translateX(2px)}}.diffgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px auto;max-width:680px}.diff{padding:16px;border:1px solid var(--line);background:#0d1121;border-radius:16px;text-align:left;color:#fff}.diff b{display:block;margin-bottom:5px}.diff small{color:var(--muted);line-height:1.4}.diff.active{border-color:var(--cyan);box-shadow:0 0 0 2px #5ee7ff18}.namebox{max-width:420px;margin:0 auto 12px}.badgegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;text-align:left;margin-top:16px}.badge{padding:12px;border:1px solid var(--line);border-radius:13px;background:#0d1120}.badge.lock{opacity:.4}.badge b{display:block}.scoreline{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:14px 0}.tag{padding:7px 10px;border-radius:999px;background:#141a31;border:1px solid var(--line);font-size:.8rem}.system{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#67f5a5;background:#050a0a;border:1px solid #244c43;padding:14px;border-radius:12px;text-align:left;font-size:.82rem}.clickdot{position:absolute;width:18px;height:18px;border-radius:50%;opacity:.03;cursor:pointer}.riddle{font-size:1.1rem;padding:15px;border-left:3px solid var(--pink);background:#12162a}.fake{position:fixed;left:50%;top:12%;transform:translateX(-50%);z-index:99;padding:12px 18px;border:1px solid var(--danger);background:#180b12;color:#ff9cac;border-radius:12px;box-shadow:0 10px 50px #000;animation:pop .35s}@keyframes pop{from{transform:translate(-50%,-20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}@media(max-width:650px){.top{padding:13px 0}.status .pill:nth-child(2){display:none}.card{border-radius:22px;padding:22px 17px}.choices,.diffgrid,.badgegrid{grid-template-columns:1fr}.inputrow{flex-direction:column}.scene{min-height:200px}.title{font-size:3.5rem}}
</style>
</head>
<body>
<div class="wrap top">
  <div class="brand">🧪 AKTER CRAZY LAB</div>
  <div class="status"><span class="pill">ROOM <b id="roomNo">0</b>/6</span><span class="pill">TIME <b id="topTime">10:00</b></span><span class="pill">❤️ <b id="topLives">3</b></span><span class="pill">💡 <b id="topHints">2</b></span><button class="btn" id="soundBtn" type="button">🔊</button></div>
</div>
<main class="screen"><div class="card" id="app"></div></main>
<script>
const app=document.getElementById('app'),roomNo=document.getElementById('roomNo'),topTime=document.getElementById('topTime'),topLives=document.getElementById('topLives'),topHints=document.getElementById('topHints');
const defaults={room:0,time:600,score:0,items:[],sound:true,started:false,lives:3,hints:2,glitches:0,difficulty:'normal',player:'',startLives:3,hintsUsed:0,perfect:true,secret:false,eggs:0,achievements:[]};
let state={...defaults};try{const s=JSON.parse(localStorage.getItem('escapeWebsiteSave'));if(s)state={...defaults,...s}}catch(e){}
let timer=null,audioCtx=null,runId=0;
const cfg={easy:{label:'CHILL',time:720,lives:5,hints:3},normal:{label:'NORMAL',time:600,lives:3,hints:2},hard:{label:'INSANE',time:420,lives:2,hints:1}};
function save(){localStorage.setItem('escapeWebsiteSave',JSON.stringify(state))}
function beep(freq=440,dur=.08,type='sine'){if(!state.sound)return;try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.04,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.connect(g);g.connect(o);o.start();o.stop(audioCtx.currentTime+dur)}catch(e){}}
function format(t){return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function render(){roomNo.textContent=state.room;topTime.textContent=format(state.time);topTime.classList.toggle('danger',state.time<=60);topLives.textContent=state.lives??3;topHints.textContent=state.hints??2;document.getElementById('soundBtn').textContent=state.sound?'🔊':'🔇'}
function set(html){app.innerHTML=html;render()}
function achievement(id,title,icon){if(!state.achievements.includes(id)){state.achievements.push(id);state.score+=75;save();toast(icon+' Achievement unlocked: '+title)}}
function toast(txt){const x=document.createElement('div');x.className='fake';x.textContent=txt;document.body.appendChild(x);setTimeout(()=>x.remove(),2600)}
function startTimer(){clearInterval(timer);const my=++runId;timer=setInterval(()=>{if(my!==runId||!state.started||state.room>=6)return;state.time--;if(Math.random()<.025)glitch();if(state.time===180)toast('⚠ SYSTEM: Something is watching you…');if(state.time===90)toast('⚠ SYSTEM: DO NOT PANIC.');if(state.time<=0){state.time=0;clearInterval(timer);timeout()}save();render()},1000)}
function glitch(){document.body.classList.add('glitch');beep(70,.08,'square');setTimeout(()=>document.body.classList.remove('glitch'),450);state.glitches++}
function loseLife(msg){state.lives--;state.perfect=false;save();if(state.lives<=0){clearInterval(timer);timeout();return false}const m=document.querySelector('.msg');if(m){m.textContent=msg+' ❤️ Lives left: '+state.lives;m.className='msg bad'}beep(120,.2,'square');return true}
function hint(text){if(state.hints<=0){toast('💡 No hints left 😈');return}state.hints--;state.hintsUsed++;state.perfect=false;state.score=Math.max(0,state.score-50);save();const m=document.querySelector('.msg');if(m){m.textContent='💡 '+text;m.className='msg good'}render()}
function resetGame(){clearInterval(timer);state={...defaults,sound:state.sound};save();startScreen()}
function startGame(diff='normal'){const c=cfg[diff];const name=(document.getElementById('playerName')?.value||'').trim().slice(0,18)||'ESCAPER';state={...defaults,sound:state.sound,started:true,room:1,time:c.time,score:0,items:[],lives:c.lives,hints:c.hints,difficulty:diff,player:name,startLives:c.lives,hintsUsed:0,perfect:true,secret:false,eggs:0,achievements:[...(state.achievements||[])]};save();beep(660,.12);startTimer();room1()}
function startScreen(){set('<div class="center"><div class="eyebrow">A BROWSER ESCAPE ROOM — V3</div><h1 class="title">ESCAPE<br>THE WEBSITE</h1><p class="subtitle">The website has evolved. It can lie, remember, glitch, hide things and now… <b>judge your performance.</b></p><div class="namebox"><input class="input" id="playerName" maxlength="18" placeholder="Enter your codename (optional)"></div><div class="diffgrid"><button class="diff active" id="dnormal" onclick="selectDiff(\'normal\')"><b>🧠 NORMAL</b><small>10 min • 3 lives • 2 hints</small></button><button class="diff" id="dhard" onclick="selectDiff(\'hard\')"><b>☠️ INSANE</b><small>7 min • 2 lives • 1 hint • nastier traps</small></button><button class="diff" id="deasy" onclick="selectDiff(\'easy\')"><b>😎 CHILL</b><small>12 min • 5 lives • 3 hints</small></button></div><div class="actions"><button class="btn primary" onclick="startGame(window.selectedDiff||\'normal\')">🚪 Enter the Website</button><button class="btn" onclick="how()">❓ How to play</button><button class="btn" onclick="showAchievements()">🏆 Achievements</button></div><div class="tiny">No downloads • Mobile friendly • Progress is saved • Every run can feel different</div><div class="footer">AKTER CRAZY LAB • <span style="cursor:pointer" onclick="logoEgg()">Do not trust the logo.</span></div></div>');window.selectedDiff='normal'}
function selectDiff(d){window.selectedDiff=d;['easy','normal','hard'].forEach(x=>document.getElementById('d'+(x==='normal'?'normal':x))?.classList.toggle('active',x===d));beep(480,.06)}
function how(){set('<div class="center"><div class="eyebrow">SURVIVAL GUIDE</div><h2>Look. Think. Click.</h2><p>Search carefully. Some clues are visible, some are hidden, and some are deliberately misleading.</p><div class="system">> SYSTEM BOOT<br>> Observe everything.<br>> Wrong answers cost lives.<br>> Hints cost score.<br>> The website may change its mind.<br>> There is more than one ending.</div><div class="puzzle"><p>🔎 Inspect suspicious things.</p><p>🧠 Think before spending a life.</p><p>😈 If a button says “DO NOT CLICK”… well, you know.</p></div><div class="actions"><button class="btn primary" onclick="startScreen()">Back</button></div></div>')}
function showAchievements(){const all=[['first','First Blood','🏃','Reach Room 2'],['smart','No Mistakes','🧠','Escape without losing a life'],['speed','Speed Demon','⚡','Escape with 3+ minutes left'],['nohint','Pure Brain','💡','Escape without using hints'],['secret','Secret Hunter','🕵️','Find the hidden exit'],['hard','Madness','☠️','Escape on Insane'],['egg','Lab Rat','🥚','Find a hidden Easter egg'],['perfect','PERFECT RUN','👑','Escape with no lives lost and no hints']];set('<div class="center"><div class="eyebrow">YOUR TROPHIES</div><h2>Achievements</h2><div class="badgegrid">'+all.map(a=>{const ok=state.achievements.includes(a[0]);return '<div class="badge '+(ok?'':'lock')+'">'+a[2]+' <b>'+a[1]+'</b><small>'+a[3]+'</small></div>'}).join('')+'</div><div class="actions" style="margin-top:20px"><button class="btn" onclick="startScreen()">Back</button></div></div>')}
function logoEgg(){state.eggs++;state.score+=25;save();beep(880,.1);toast('🥚 EASTER EGG: The lab noticed you.');if(state.eggs>=2)achievement('egg','Lab Rat','🥚')}
function timeout(){state.started=false;save();beep(90,.5,'sawtooth');set('<div class="center"><div class="win">⏰</div><div class="eyebrow">BAD ENDING</div><h2>'+state.player+', the website won.</h2><p>You reached room <b>'+Math.min(state.room,6)+'</b> with <b>'+state.score+'</b> points. The door is still locked.</p><div class="system">> CLOCK: 00:00<br>> STATUS: ESCAPER LOST<br>> SYSTEM: “Nice try.”</div><div class="actions"><button class="btn primary" onclick="resetGame()">🔁 Try again</button><button class="btn" onclick="startScreen()">🏠 Main menu</button></div></div>')}
function room1(){state.room=1;save();set('<div class="game-head"><div><div class="room">ROOM 01 — THE EMPTY ROOM</div><h2>The door has no key.</h2></div><div>🔒</div></div><p>A screen, a clock and a hidden clue. Find the <b>four-digit code</b>.</p><div class="scene"><div class="door"><span>01</span></div><div style="position:absolute;left:12px;bottom:12px"><span class="clue">SCREEN: 7</span><span class="clue">CLOCK: '+(state.difficulty==='hard'?'6':'3')+'</span><span class="clue hidden" onclick="eggClue()" title="Something is hiding here">HIDDEN: '+(state.difficulty==='hard'?'9':'4')+'</span></div></div><div class="puzzle"><b>🔐 What is the code?</b><p>Visible clues come first. The hidden clue comes last.</p><div class="inputrow"><input class="input" id="a1" inputmode="numeric" maxlength="4" placeholder="Enter 4 digits"><button class="btn primary" onclick="check1()">Unlock</button></div><div class="msg" id="m1"></div><button class="btn" style="margin-top:10px" onclick="hint('The order is SCREEN → CLOCK → HIDDEN.')">💡 Hint</button></div>')}
function eggClue(){state.eggs++;state.score+=25;save();beep(900,.08);toast('🥚 Hidden clue touched.');if(state.eggs>=2)achievement('egg','Lab Rat','🥚')}
function check1(){const v=document.getElementById('a1').value.trim(),good=state.difficulty==='hard'?'769':'734';if(v===good+'1'){beep(880,.16);state.score+=100;state.items.push('🗝️ Bronze Key');state.room=2;achievement('first','First Blood','🏃');save();setTimeout(room2,250)}else{if(!loseLife('Wrong code.'))return;document.getElementById('m1').textContent='The room has more than three numbers…';document.getElementById('m1').className='msg bad';app.classList.remove('shake');void app.offsetWidth;app.classList.add('shake')}}
function room2(){state.room=2;save();const seq=state.difficulty==='hard'?'3 → 6 → 12 → 24 → ?':'2 → 4 → 8 → 16 → ?';set('<div class="game-head"><div><div class="room">ROOM 02 — THE CLOCK</div><h2>Time is telling you something.</h2></div><div>🕰️</div></div><p>The clock is frozen. Four buttons surround it. Only one continues the sequence.</p><div class="scene"><div style="font-size:3.5rem;font-weight:900;letter-spacing:.08em">'+(state.difficulty==='hard'?'11:47':'08:24')+'</div></div><div class="puzzle"><b>🧠 What comes next?</b><p>'+seq+'</p><div class="choices">'+[24,32,30,18].map((v,i)=>'<button class="choice" onclick="answer2(this,'+(state.difficulty==='hard'?(v===48?48:v):v)+')">'+(state.difficulty==='hard'?[48,36,42,54][i]:v)+'</button>').join('')+'</div><div class="msg" id="m2"></div><button class="btn" style="margin-top:10px" onclick="hint(\'Double the previous number.\')">💡 Hint</button></div>')}
function answer2(el,v){const good=state.difficulty==='hard'?48:32;if(v===good){beep(990,.16);el.classList.add('used');state.score+=150;state.items.push('🕰️ Time Fragment');state.room=3;save();setTimeout(room3,350)}else{if(!loseLife('Wrong sequence.'))return;document.getElementById('m2').textContent='Wrong. Follow the pattern, not the clock.';document.getElementById('m2').className='msg bad'}}
function room3(){state.room=3;save();const symbols=state.difficulty==='hard'?['🦉','🔥','🐉','🔑','🌙','⭐']:['🌙','🔥','🐉','🔑','⭐'];state.memSymbols=symbols;set('<div class="game-head"><div><div class="room">ROOM 03 — THE MEMORY WALL</div><h2>Remember before the lights go out.</h2></div><div>🧠</div></div><p>Memorize the symbols for <b>'+ (state.difficulty==='hard'?'3':'4') +' seconds</b>. Then they disappear.</p><div class="scene" id="memoryScene"><div style="font-size:2.1rem;letter-spacing:.4em">'+symbols.join(' ')+'</div></div><div class="puzzle"><div id="memoryText"><b>Ready?</b><p>Press start. The symbols will vanish.</p><button class="btn primary" onclick="memoryStart()">Start memory test</button></div></div>')}
function memoryStart(){const delay=state.difficulty==='hard'?3000:4000;beep(520,.08);setTimeout(()=>{document.getElementById('memoryScene').innerHTML='<div style="font-size:3rem">???</div>';const third=state.memSymbols[2];document.getElementById('memoryText').innerHTML='<b>Which symbol was third?</b><div class="choices">'+['🌙','🔥','🐉','🔑','⭐','🦉'].filter(x=>state.memSymbols.includes(x)).map(x=>'<button class="choice" onclick="memoryAnswer(this,\''+x+'\')">'+x+'</button>').join('')+'</div><div class="msg" id="m3"></div>'},delay)}
function memoryAnswer(el,v){if(v===state.memSymbols[2]){beep(1040,.16);state.score+=200;state.items.push('🐉 Dragon Sigil');state.room=4;save();setTimeout(room4,350)}else{if(!loseLife('The memory wall rejects that answer.'))return;document.getElementById('m3').textContent='The memory wall rejects that answer.';document.getElementById('m3').className='msg bad'}}
function room4(){state.room=4;save();set('<div class="game-head"><div><div class="room">ROOM 04 — THE LIAR</div><h2>Logic has entered the chat.</h2></div><div>👁️</div></div><p>Three terminals speak. Exactly <b>one statement is true</b>.</p><div class="riddle"><p>🟥 A: “The blue terminal is safe.”</p><p>🟦 B: “Statement A is false.”</p><p>🟩 C: “The green terminal is not safe.”</p><p><b>Which terminal should you press?</b></p></div><div class="choices"><button class="choice" onclick="liar(this,'A')">🟥 A</button><button class="choice" onclick="liar(this,'B')">🟦 B</button><button class="choice" onclick="liar(this,'C')">🟩 C</button></div><div class="msg" id="m4"></div><button class="btn" style="margin-top:10px" onclick="hint('Treat B as a statement about A, then test the one-truth condition.')">💡 Hint</button>')}
function liar(el,v){if(v==='B'){beep(1080,.2);state.score+=250;state.items.push('👁️ Truth Fragment');state.room=5;save();setTimeout(room5,350)}else{if(!loseLife('The terminal laughs.'))return;document.getElementById('m4').textContent='The terminal laughs. Try the logic again.';document.getElementById('m4').className='msg bad'}}
function room5(){state.room=5;save();set('<div class="game-head"><div><div class="room">ROOM 05 — THE FINAL DOOR</div><h2>The website knows your score.</h2></div><div>🚪</div></div><p>Use the <b>first letters</b> of your three collected fragments.</p><div class="inventory">'+state.items.map(x=>'<span class="item">'+x+'</span>').join('')+'</div><div class="scene"><div class="door"><span>EXIT</span></div></div><div class="puzzle"><b>🔑 Final password</b><p>Bronze + Time + Dragon + Truth → first letters.</p><div class="inputrow"><input class="input" id="final" maxlength="12" placeholder="Enter password"><button class="btn primary" onclick="finish()">Escape</button></div><div class="msg" id="mf"></div><button class="btn" style="margin-top:10px" onclick="hint('The password is four letters: B + T + D + T.')">💡 Hint</button></div>')}
function finish(){const v=document.getElementById('final').value.trim().toLowerCase();if(v==='btdt'){beep(1200,.15);state.room=6;state.score+=500;state.started=true;save();clearInterval(timer);finalRoom()}else{if(!loseLife('The final door rejects you.'))return;document.getElementById('mf').textContent='The door whispers: “First letters…”';document.getElementById('mf').className='msg bad'}}
function finalRoom(){state.room=6;save();set('<div class="center"><div class="eyebrow">SECRET ROOM — THE CORE</div><h2>One last choice, '+state.player+'.</h2><p>The obvious button is bait. The core is testing whether you learned anything.</p><div class="scene"><button id="dontBtn" class="btn primary" style="font-size:1.2rem;padding:18px 28px" onclick="coreTrap()">DO NOT CLICK ME</button><button class="clickdot" style="right:9%;top:8%" onclick="secretDot()"></button></div><div class="puzzle"><b>🧪 CORE CHECK</b><p>There may be more than one way out.</p><div class="msg" id="coreMsg"></div></div></div>')}
function secretDot(){state.secret=true;state.eggs++;state.score+=300;achievement('secret','Secret Hunter','🕵️');beep(1200,.15);toast('🕵️ SECRET PATH FOUND');setTimeout(()=>secretEnding(),500)}
function coreTrap(){state.score+=100;beep(1000,.1);const b=document.getElementById('dontBtn');b.textContent='😈 TOO LATE';b.classList.add('danger');document.getElementById('coreMsg').innerHTML='The website expected that. Now find the <b>tiny hidden EXIT</b> somewhere on this screen.';const x=document.createElement('button');x.setAttribute('aria-label','secret exit');x.style='position:fixed;right:7%;bottom:7%;width:72px;height:26px;opacity:.02;background:transparent;border:0;cursor:pointer';x.onclick=()=>{x.remove();state.secret=true;state.room=7;state.started=false;save();win()};document.body.appendChild(x)}
function secretEnding(){state.started=false;state.room=8;save();set('<div class="center"><div class="win">🕵️</div><div class="eyebrow">SECRET ENDING</div><h1 class="title" style="font-size:clamp(2.7rem,9vw,5.5rem)">YOU<br>FOUND<br>THE BACKDOOR</h1><p class="subtitle">You ignored the obvious path and found something the website never meant to reveal.</p><div class="system">> ACCESS: ROOT<br>> PLAYER: '+state.player+'<br>> STATUS: UNEXPECTEDLY CLEVER<br>> MESSAGE: “Keep this secret.”</div><div class="scoreline"><span class="tag">Score: <b>'+state.score+'</b></span><span class="tag">Eggs: <b>'+state.eggs+'</b></span></div><div class="actions"><button class="btn primary" onclick="resetGame()">🔁 Run it again</button><button class="btn" onclick="startScreen()">🏠 Main menu</button></div></div>');beep(700,.12);setTimeout(()=>beep(1100,.18),150)}
function win(){let left=state.time;state.started=false;if(left>=180)achievement('speed','Speed Demon','⚡');if(state.hintsUsed===0)achievement('nohint','Pure Brain','💡');if(state.perfect){achievement('smart','No Mistakes','🧠');if(state.hintsUsed===0)achievement('perfect','PERFECT RUN','👑')}if(state.difficulty==='hard')achievement('hard','Madness','☠️');save();const pct=Math.min(100,Math.round(state.score/15));set('<div class="center"><div class="win">🏆</div><div class="eyebrow">ESCAPE SUCCESSFUL</div><h1 class="title" style="font-size:clamp(3rem,10vw,6rem)">'+state.player+'<br>ESCAPED!</h1><p class="subtitle">You beat the full escape sequence. The clock stopped with <b>'+format(left)+'</b> left.</p><div class="scoreline"><span class="tag">🏆 Score: <b>'+state.score+'</b></span><span class="tag">❤️ Lives: <b>'+state.lives+'/'+state.startLives+'</b></span><span class="tag">💡 Hints used: <b>'+state.hintsUsed+'</b></span></div><div class="meter"><i style="width:'+pct+'%"></i></div><div class="actions"><button class="btn primary" onclick="resetGame()">🔁 Play again</button><button class="btn" onclick="showAchievements()">🏅 Trophies</button><button class="btn" onclick="startScreen()">🏠 Main menu</button></div><div class="tiny">There may still be an ending you haven't seen. 👀</div></div>');beep(880,.12);setTimeout(()=>beep(1175,.18),130)}
document.getElementById('soundBtn').onclick=()=>{state.sound=!state.sound;save();render();if(state.sound)beep(660,.08)}
if(state.started&&state.room>0&&state.room<6){startTimer();({1:room1,2:room2,3:room3,4:room4,5:room5}[state.room]||room1)()}else if(state.room===6&&state.started){finalRoom()}else if(state.room===7){win()}else if(state.room===8){secretEnding()}else startScreen();
</script>
</body>
</html>
