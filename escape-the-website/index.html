<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escape The Website</title><style>body{margin:0;min-height:100vh;background:#070812;color:#fff;font-family:system-ui,Arial}.wrap{max-width:900px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center}.brand{color:#5ee7ff;font-weight:900}.hud{display:flex;gap:8px}.pill{padding:7px 10px;border:1px solid #30385f;border-radius:20px;color:#aab3d5;font-size:12px}.card{max-width:760px;margin:50px auto;padding:45px 25px;border:1px solid #30385f;border-radius:28px;background:#10152a;text-align:center;box-shadow:0 25px 80px #0008}.eyebrow{color:#ff5ebc;font-size:12px;font-weight:900;letter-spacing:3px}.title{font-size:clamp(48px,10vw,90px);line-height:.88;margin:18px 0;background:linear-gradient(90deg,#fff,#5ee7ff,#ff5ebc);-webkit-background-clip:text;color:transparent}p{color:#aab3d5;line-height:1.6}.input{width:min(400px,100%);padding:14px;border-radius:12px;border:1px solid #39456d;background:#080a13;color:#fff;box-sizing:border-box}.modes{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px}.mode,.btn{padding:13px 18px;border-radius:13px;border:1px solid #39456d;background:#171c34;color:#fff;font-weight:800;cursor:pointer}.mode.active,.primary{background:linear-gradient(135deg,#226d86,#5a42a9);border-color:#5ee7ff}.start{font-size:20px;padding:17px 30px;min-width:220px;box-shadow:0 0 30px #5ee7ff22}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.puzzle{margin-top:20px;padding:20px;border:1px solid #30385f;border-radius:16px;background:#0b0f1e}.row{display:flex;gap:8px}.choice{display:block;width:100%;padding:15px;margin:8px 0;border:1px solid #30385f;border-radius:12px;background:#11162a;color:#fff;text-align:left;cursor:pointer}.msg{min-height:25px;margin-top:10px;font-weight:800}.bad{color:#ff5d73}.good{color:#67f5a5}.clues{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.clue{padding:12px;border:1px solid #30385f;border-radius:12px;background:#0b0f1e}.clue b{display:block;color:#5ee7ff;font-size:22px}@media(max-width:600px){.row{flex-direction:column}.clues{grid-template-columns:repeat(2,1fr)}.card{margin:25px auto;padding:28px 16px}.hud{display:none}}</style></head><body><header class="wrap top"><div class="brand">🧪 AKTER CRAZY LAB</div><div class="hud"><span class="pill">ROOM <b id="room">0</b>/5</span><span class="pill">TIME <b id="time">00:00</b></span><span class="pill">❤️ <b id="lives">0</b></span></div></header><main class="wrap"><section class="card" id="app"></section></main><script>const app=document.getElementById('app');let mode='normal',game=null,timer=null;const cfg={chill:[720,5],normal:[600,3],insane:[420,2]};function draw(x){app.innerHTML=x;hud()}function hud(){document.getElementById('room').textContent=game?game.room:0;document.getElementById('time').textContent=game?fmt(game.time):'00:00';document.getElementById('lives').textContent=game?game.lives:0}function fmt(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function menu(){clearInterval(timer);game=null;draw('<div class="eyebrow">AKTER CRAZY LAB • FINAL EDITION</div><h1 class="title">ESCAPE<br>THE WEBSITE</h1><p>A crazy browser escape-room. Solve the puzzles, survive the traps and escape.</p><input class="input" id="name" maxlength="18" placeholder="Enter your codename (optional)"><div class="modes"><button class="mode" data-m="chill">😎 CHILL</button><button class="mode active" data-m="normal">🧠 NORMAL</button><button class="mode" data-m="insane">☠️ INSANE</button></div><div class="actions"><button class="btn primary start" id="START_GAME_BUTTON">🚪 START GAME</button></div><p><small>Choose a mode, then press START GAME. That's it. 😎</small></p>');document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('active',x.dataset.m===mode))});document.getElementById('START_GAME_BUTTON').onclick=start}function start(){const c=cfg[mode];game={room:1,time:c[0],lives:c[1],name:(document.getElementById('name').value||'ESCAPER').trim(),score:0};clearInterval(timer);timer=setInterval(()=>{if(!game)return;if(game.time<=1){game.time=0;hud();end('⏰ TIME OUT','The website won.');return}game.time--;hud()},1000);room1()}function wrong(t){game.lives--;const m=document.querySelector('.msg');if(m){m.textContent=t+' • ❤️ '+game.lives+' left';m.className='msg bad'}hud();if(game.lives<=0)setTimeout(()=>end('💀 GAME OVER','You ran out of lives.'),200)}function room1(){const n=mode==='insane'?'6':'3';draw('<div class="eyebrow">ROOM 01 / 05</div><h2>🔐 Find the four-digit code</h2><p><b>Super easy clue:</b> just read the four blue numbers <b>from left to right</b>.</p><div class="clues"><div class="clue"><b>7</b>SCREEN</div><div class="clue"><b>'+n+'</b>CLOCK</div><div class="clue"><b>4</b>STAR</div><div class="clue"><b>1</b>DOOR</div></div><div class="puzzle"><input class="input" id="ans" inputmode="numeric" maxlength="4" placeholder="Enter code"><button class="btn primary" id="unlock">🔓 UNLOCK</button><div class="msg"></div><br><button class="btn" id="hint">💡 Hint</button></div>');document.getElementById('unlock').onclick=()=>{if(document.getElementById('ans').value.trim()===(mode==='insane'?'7641':'7341')){game.room=2;room2()}else wrong('Read the four numbers left → right.')};document.getElementById('hint').onclick=()=>{const m=document.querySelector('.msg');m.textContent='💡 7 + '+n+' + 4 + 1 = your code';m.className='msg good'}}function room2(){draw('<div class="eyebrow">ROOM 02 / 05</div><h2>🕰️ Crack the sequence</h2><div class="puzzle"><h2>'+(mode==='insane'?'3 → 6 → 12 → 24 → ?':'2 → 4 → 8 → 16 → ?')+'</h2><button class="choice" data-v="32">32</button><button class="choice" data-v="48">48</button><button class="choice" data-v="24">24</button><button class="choice" data-v="54">54</button><div class="msg"></div></div>');document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{if(+b.dataset.v===(mode==='insane'?48:32)){game.room=3;room3()}else wrong('Double the previous number.')})}function room3(){const sy=['🌙','🔥','🐉','🔑','⭐'];draw('<div class="eyebrow">ROOM 03 / 05</div><h2>🧠 Memory Wall</h2><p>Remember the third symbol.</p><div class="puzzle" id="memory"><div style="font-size:42px">'+sy.join(' ')+'</div><button class="btn primary" id="test">START MEMORY TEST</button></div>');document.getElementById('test').onclick=()=>{memory.innerHTML='<p>Which symbol was third?</p>'+sy.map(x=>'<button class="choice mem" data-s="'+x+'">'+x+'</button>').join('')+'<div class="msg"></div>';document.querySelectorAll('.mem').forEach(b=>b.onclick=()=>{if(b.dataset.s==='🐉'){game.room=4;room4()}else wrong('Not the third symbol.')})}}function room4(){draw('<div class="eyebrow">ROOM 04 / 05</div><h2>👁️ The truthful terminal</h2><div class="puzzle"><p>Exactly one statement is true.</p><p>A: The blue terminal is safe.</p><p>B: Statement A is false.</p><p>C: The green terminal is not safe.</p><button class="choice liar" data-v="A">A</button><button class="choice liar" data-v="B">B</button><button class="choice liar" data-v="C">C</button><div class="msg"></div></div>');document.querySelectorAll('.liar').forEach(b=>b.onclick=()=>{if(b.dataset.v==='B'){game.room=5;room5()}else wrong('The terminal rejects your choice.')})}function room5(){draw('<div class="eyebrow">ROOM 05 / 05</div><h2>🚪 Final Password</h2><p>Take the first letter: <b>Bronze • Time • Dragon • Truth</b></p><div class="puzzle"><input class="input" id="final" maxlength="4" placeholder="BTDT"><button class="btn primary" id="escape">ESCAPE</button><div class="msg"></div></div>');document.getElementById('escape').onclick=()=>{if(document.getElementById('final').value.trim().toUpperCase()==='BTDT')end('🏆 YOU ESCAPED!','Congratulations, '+game.name+'! Score: '+game.score);else wrong('The password is BTDT.')}}function end(title,text){clearInterval(timer);const old=game;game=null;draw('<div class="eyebrow">MISSION COMPLETE</div><h1 class="title">'+title+'</h1><p>'+text+'</p><button class="btn primary start" id="again">🔁 PLAY AGAIN</button><button class="btn" id="menu">🏠 MENU</button>');document.getElementById('again').onclick=start;document.getElementById('menu').onclick=menu}menu();</script></body></html>
