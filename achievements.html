<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Achievements — GAME HUB OF SIR</title><style>*{box-sizing:border-box}body{margin:0;background:#070812;color:#fff;font-family:system-ui,Arial}.wrap{max-width:1050px;width:92%;margin:auto;padding:20px 0 70px}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#fff;text-decoration:none;border:1px solid #30385f;padding:9px 13px;border-radius:11px}.hero{text-align:center;padding:45px 0 25px}.hero h1{font-size:clamp(42px,8vw,72px);margin:10px 0;background:linear-gradient(90deg,#fff,#ffe27a,#ff72c8);-webkit-background-clip:text;color:transparent}.muted{color:#9da5c7}.progress{max-width:650px;margin:20px auto;height:12px;background:#1d2340;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffe27a,#ff72c8);transition:.5s}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}.card{padding:19px;border:1px solid #2d365d;border-radius:18px;background:linear-gradient(145deg,#11162a,#090b15);min-height:155px}.card.locked{opacity:.45}.icon{font-size:38px}.card h3{margin:9px 0 5px}.card p{margin:0;color:#929bb8;font-size:13px;line-height:1.45}.status{display:inline-block;margin-top:12px;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:900;background:#183426;color:#8ff2b0}.locked .status{background:#25283a;color:#8990a7}</style></head><body><div class="wrap"><header class="top"><b>🎮 GAME HUB OF SIR</b><a href="index.html">← Game Hub</a></header><section class="hero"><div style="font-size:70px">🏆</div><h1>ACHIEVEMENT ROOM</h1><p class="muted">Discover secrets across the Game Universe. Progress is saved on this device.</p><div id="summary" class="muted"></div><div class="progress"><i id="bar"></i></div></section><section class="grid" id="grid"></section></div><script>const A=[['🪄','Reality Breaker','Discover your first changing world','everyTimeDiscoveries',v=>Number(v||0)>=1],['🌌','World Traveler','Discover 5 changing worlds','everyTimeDiscoveries',v=>Number(v||0)>=5],['🧪','Lab Apprentice','Discover your first lab reaction','crazyLabFound',v=>Array.isArray(v)&&v.length>=1],['🏆','Lab Master','Discover all 8 lab reactions','crazyLabFound',v=>Array.isArray(v)&&v.length>=8],['🐉','Dragon Awakener','Hatch your first dragon','dragonEggState',v=>!!v?.hatched?.length],['👑','Dragon Master','Discover every dragon','dragonEggState',v=>(v?.hatched?.length||0)>=4],['🔮','Mind Reader','Reach 100 Oracle points','mindReaderStats',v=>(v?.score||0)>=100],['🗝️','Escape Artist','Finish an escape run','escapeCompleted',v=>Number(v||0)>=1],['🎮','Game Explorer','Visit the Game Hub','hubVisited',v=>Number(v||0)>=1],['🕵️','Secret Finder','Trigger the hidden Hub secret','hubSecretFound',v=>Number(v||0)>=1]];function get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}function render(){let n=0;document.getElementById('grid').innerHTML=A.map(a=>{const ok=a[4](get(a[3]));if(ok)n++;return '<article class="card '+(ok?'':'locked')+'"><div class="icon">'+a[0]+'</div><h3>'+a[1]+'</h3><p>'+a[2]+'</p><span class="status">'+(ok?'✓ UNLOCKED':'🔒 LOCKED')+'</span></article>'}).join('');document.getElementById('summary').textContent=n+' / '+A.length+' achievements unlocked';document.getElementById('bar').style.width=(n/A.length*100)+'%'}render();</script></body></html>
