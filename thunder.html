<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Thunder Tap</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="thunder.css">
</head>

<body>

  <!-- Header -->

  <header class="simple-header">
    <div class="simple-header-container">

      <a href="index.html" class="simple-logo">
        <img
          src="https://cdn-icons-png.flaticon.com/512/686/686589.png"
          alt="Logo">

        <span>GAME HUB OF SIR</span>
      </a>

      <nav class="simple-nav">
        <a href="index.html">Home</a>
        <a href="games.html">Games</a>
        <a href="leaderboard.html">Leaderboard</a>
        <a href="profile.html">Profile</a>
      </nav>

      <button class="theme-btn">🌙</button>

    </div>
  </header>

  <!-- Game Area -->

  <main class="game-page">

    <div class="game-box thunder-box">

      <h1>⚡ Thunder Tap</h1>

      <p>
        Wait for the lightning and tap as fast as possible!
      </p>

      <!-- Round Info -->

      <div class="thunder-info">

        <div class="thunder-round">
          Round:
          <strong id="round">1</strong>/5
        </div>

        <div class="thunder-best">
          Best:
          <strong id="bestTime">--</strong>
        </div>

      </div>

      <!-- Thunder Screen -->

      <div id="thunderArea" class="thunder-area">

        <div id="message" class="thunder-message">
          Press Start
        </div>

        <div id="lightning" class="lightning hidden">
          ⚡
        </div>

      </div>

      <!-- Result -->

      <div class="thunder-result">
        Reaction:
        <strong id="reaction">0.000s</strong>
      </div>

      <!-- Start Button -->

      <button id="startBtn" class="play-btn">
        ▶ Start Challenge
      </button>

    </div>

  </main>

  <!-- Footer -->

  <footer class="simple-footer">

    <div class="simple-footer-container">

      <h2>GAME HUB OF SIR</h2>

      <p>
        Learn, Play & Improve your skills with fun games.
      </p>

      <div class="footer-social">

        <a href="https://www.facebook.com/ahr110" target="_blank">
          Facebook
        </a>

        <a href="https://wa.me/8801884197276" target="_blank">
          WhatsApp
        </a>

        <a href="mailto:aakterhossen80@gmail.com">
          Email
        </a>

      </div>

      <p class="footer-copy">
        © 2026 GAME HUB OF SIR
      </p>

    </div>

  </footer>

  <script src="thunder.js"></script>

</body>
</html>
