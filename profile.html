<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4f46e5"><title>Profile — GAME HUB OF SIR</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="responsive.css"><link rel="stylesheet" href="hub-v2.css"></head><body class="hub-home"><header class="simple-header"><div class="simple-header-container"><a href="index.html" class="simple-logo"><span class="logo-mark">🎮</span><span>GAME HUB OF SIR</span></a><nav class="simple-nav"><a href="index.html">Home</a><a href="games.html">Games</a><a href="leaderboard.html">Leaderboard</a><a class="active" href="profile.html">Profile</a><button id="themeBtn" class="theme-btn" type="button">🌙</button></nav></div></header><main class="hub-section"><div class="hub-section-head"><div><span class="hub-kicker">YOUR ACTIVITY</span><h2>My Profile</h2></div><a href="index.html">← Home</a></div><div class="hub-grid" id="profileStats"></div><div class="hub-subsection"><div class="hub-subhead"><h3>Recently played</h3></div><div class="hub-grid" id="profileRecent"></div></div><div class="hub-empty" id="profileEmpty" hidden><div>🎮</div><h3>No games played yet</h3><p>Pick a game and your activity will appear here.</p></div></main><footer class="simple-footer"><div class="simple-footer-container"><h2>GAME HUB OF SIR</h2><p>Your game activity is stored privately on this device.</p><p class="footer-copy">© 2026 GAME HUB OF SIR</p></div></footer><script>const G=[['Reaction Time Test','reaction.html','⚡'],['Coin Toss','coin.html','🪙'],['Whack The Alien','alien.html','👽'],['Dice Roller','dice.html','🎲'],['Tic Tac Toe','tic.html','❌'],['Spin The Wheel','wheel.html','🎡'],['Truth Or Dare','truth.html','🤔'],['Random Challenge','challenge.html','🎯'],['Aim Trainer','aim.html','🎯'],['Banana Slip Battle','banana.html','🍌'],['Jump Game','jump.html','🦘'],['Memory Match','memory.html','🧠'],['Rock Paper Scissors','rps.html','✊'],['Mind Reader','mindreader.html','🔮'],['Balloon Pop','balloon.html','🎈'],['Neon Catcher','neon.html','🌌'],['Rocket Dodge','rocket.html','🚀'],['Thunder Tap','thunder.html','⚡'],['Target Storm','target.html','🎯'],['Animation Gallery','animation.html','🎬'],['Cosmic Odyssey','cosmic.html','🌌'],['Penguin Slide','penguin.html','🐧']];const P=JSON.parse(localStorage.getItem('gh_plays_v2')||'{}'),R=JSON.parse(localStorage.getItem('gh_recent_v2')||'[]'),F=JSON.parse(localStorage.getItem('gh_favorites_v2')||'[]');document.documentElement.dataset.theme=localStorage.getItem('gh_theme_v2')||'light';document.querySelector('#themeBtn').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('gh_theme_v2',t)};document.querySelector('#themeBtn').textContent=document.documentElement.dataset.theme==='dark'?'☀️':'🌙';const total=Object.values(P).reduce((a,b)=>a+Number(b||0),0),unique=Object.keys(P).length;document.querySelector('#profileStats').innerHTML=`<article class="hub-card"><span class="hub-game-icon">🎮</span><h3>${total}</h3><p>Total plays on this device</p></article><article class="hub-card"><span class="hub-game-icon">🏆</span><h3>${unique}</h3><p>Different games played</p></article><article class="hub-card"><span class="hub-game-icon">❤️</span><h3>${F.length}</h3><p>Favorite games</p></article>`;const recent=R.map(id=>G.find(g=>G.indexOf(g)+1===Number(id))).filter(Boolean);const el=document.querySelector('#profileRecent');el.innerHTML=recent.map(g=>`<article class="hub-card"><div class="hub-game-icon">${g[2]}</div><h3>${g[0]}</h3><button class="hub-play" onclick="location.href='${g[1]}'">Play again →</button></article>`).join('');document.querySelector('#profileEmpty').hidden=recent.length>0;</script></body></html>
