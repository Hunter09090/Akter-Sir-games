<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile — GAME HUB OF SIR</title><style>*{box-sizing:border-box}body{margin:0;background:#070812;color:#fff;font-family:system-ui,Arial}.wrap{max-width:980px;width:92%;margin:auto;padding:20px 0 70px}.top{display:flex;justify-content:space-between;align-items:center}.top a{color:#fff;text-decoration:none;border:1px solid #30385f;padding:9px 13px;border-radius:11px}.hero{text-align:center;padding:45px 0 25px}.avatar{font-size:70px}.hero h1{font-size:42px;margin:7px 0}.muted{color:#9da5c7}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.panel{background:#101426;border:1px solid #2b3457;border-radius:18px;padding:18px}.stat{text-align:center}.stat b{display:block;font-size:27px}.panel{margin-top:14px}.panel h2{margin-top:0}.bar{height:10px;background:#202744;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#5ee7ff,#ff5ebc);width:0}.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.badge{padding:13px;border:1px solid #2c3558;border-radius:14px;background:#0b0e1a}.badge.locked{opacity:.42}.badge b{display:block;font-size:23px;margin-bottom:4px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}button{border:1px solid #3c4a7c;background:#18203b;color:#fff;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.badges{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><header class="top"><b>🎮 GAME HUB OF SIR</b><a href="index.html">← Game Hub</a></header><section class="hero"><div class="avatar">👑</div><h1 id="name">Player</h1><div class="muted">Local player profile • progress stays on this device</div></section><div class="stats"><div class="stat"><b id="plays">0</b><span class="muted">Total Plays</span></div><div class="stat"><b id="unique">0</b><span class="muted">Games Played</span></div><div class="stat"><b id="ach">0/10</b><span class="muted">Achievements</span></div><div class="stat"><b id="disc">0</b><span class="muted">Discoveries</span></div></div><section class="panel"><h2>🏆 Universe Completion</h2><p class="muted" id="completion"></p><div class="bar"><i id="bar"></i></div><div class="actions"><button id="rename">✏️ Rename</button><button id="reset">↻ Reset profile name/activity</button><a href="achievements.html" style="color:#fff;text-decoration:none;border:1px solid #3c4a7c;border-radius:10px;padding:10px 13px">🏆 Trophy Room</a></div></section><section class="panel"><h2>🎖️ Achievement Preview</h2><div class="badges" id="badges"></div></section></div><script>const $=id=>document.getElementById(id),badges=[['🪄','Reality Breaker',()=>Number(localStorage.getItem('everyTimeDiscoveries')||0)>=1],['🌌','World Traveler',()=>Number(localStorage.getItem('everyTimeDiscoveries')||0)>=5],['🧪','Lab Apprentice',()=>{try{return (JSON.parse(localStorage.getItem('crazyLabFound')||'[]').length)>=1}catch(e){return false}}],['🏆','Lab Master',()=>{try{return (JSON.parse(localStorage.getItem('crazyLabFound')||'[]').length)>=8}catch(e){return false}}],['🐉','Dragon Awakener',()=>{try{return (JSON.parse(localStorage.getItem('dragonEggState')||'{}').hatched||[]).length>=1}catch(e){return false}}],['👑','Dragon Master',()=>{try{return (JSON.parse(localStorage.getItem('dragonEggState')||'{}').hatched||[]).length>=4}catch(e){return false}}],['🔮','Mind Reader',()=>{try{return Number(JSON.parse(localStorage.getItem('mindReaderStats')||'{}').score||0)>=100}catch(e){return false}}],['🗝️','Escape Artist',()=>Number(localStorage.getItem('escapeCompleted')||0)>=1],['🎮','Game Explorer',()=>Number(localStorage.getItem('hubVisited')||0)>=1],['🕵️','Secret Finder',()=>Number(localStorage.getItem('hubSecretFound')||0)>=1]];function ok(a){try{return a[2]()}catch(e){return false}}function render(){const p=JSON.parse(localStorage.getItem('gh_plays_v2')||'{}'),plays=Object.values(p).reduce((a,b)=>a+Number(b||0),0),unique=Object.keys(p).length,n=badges.filter(ok).length,disc=Number(localStorage.getItem('everyTimeDiscoveries')||0)+(()=>{try{return JSON.parse(localStorage.getItem('crazyLabFound')||'[]').length}catch(e){return 0}})()+(()=>{try{return (JSON.parse(localStorage.getItem('dragonEggState')||'{}').hatched||[]).length}catch(e){return 0}})();$('plays').textContent=plays;$('unique').textContent=unique;$('ach').textContent=n+'/10';$('disc').textContent=disc;$('completion').textContent=n+' of 10 achievements unlocked';$('bar').style.width=(n/10*100)+'%';$('badges').innerHTML=badges.map(a=>'<div class="badge '+(ok(a)?'':'locked')+'"><b>'+a[0]+' '+(ok(a)?'✓':'🔒')+'</b>'+a[1]+'</div>').join('');if(localStorage.getItem('sirPlayerName'))$('name').textContent=localStorage.getItem('sirPlayerName')}$('rename').onclick=()=>{const n=prompt('Player name:',localStorage.getItem('sirPlayerName')||'Player');if(n&&n.trim()){localStorage.setItem('sirPlayerName',n.trim().slice(0,24));render()}};$('reset').onclick=()=>{if(confirm('Reset profile name and Game Hub play history? Your individual game saves will remain safe.')){localStorage.removeItem('sirPlayerName');localStorage.removeItem('gh_plays_v2');localStorage.removeItem('gh_recent_v2');render()}};localStorage.setItem('hubVisited','1');render();</script></body></html>
