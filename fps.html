<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FPS Arena</title>

  <!-- Game CSS -->
  <link rel="stylesheet" href="fps.css">

  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>

<body>

  <!-- ==========================
       HUD
  =========================== -->

  <div class="hud">

    <div class="hud-left">

      <div class="hud-box">
        ❤️ <span id="health">100</span>
      </div>

      <div class="hud-box">
        🎯 <span id="kills">0</span>
      </div>

    </div>

    <div class="hud-right">

      <div class="hud-box ammo-box">
        🔫 <span id="ammo">30</span>
      </div>

    </div>

  </div>

  <!-- Crosshair -->

  <div class="crosshair"></div>

  <!-- 3D Game Area -->

  <div id="gameContainer" class="game-container"></div>

  <!-- Mobile Controls -->

  <div class="mobile-controls">

    <button id="leftBtn" class="control-btn">⬅️</button>

    <button id="forwardBtn" class="control-btn">⬆️</button>

    <button id="rightBtn" class="control-btn">➡️</button>

    <button id="shootBtn" class="control-btn shoot-btn">🔫</button>

  </div>

  <!-- Instructions Overlay -->

  <div id="startOverlay" class="start-overlay">

    <div class="start-card">

      <h1>🔫 FPS ARENA</h1>

      <p>WASD / Arrow Keys to move</p>

      <p>SPACE to shoot</p>

      <p>Destroy enemies and survive as long as possible.</p>

      <button id="startBtn" class="start-btn">
        ▶ START GAME
      </button>

    </div>

  </div>

  <!-- Game Script -->

  <script src="fps.js"></script>

</body>
</html>
